<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ленаполия</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lobster&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Rubik,system-ui,sans-serif;background:#fdf1f6;color:#2a2230;padding:8px}
button{font-family:inherit}
#app{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:flex-start}
.board{--W:min(calc(100vw - 16px),88vh,760px);width:var(--W);height:var(--W);display:grid;
 grid-template-columns:1.6fr repeat(9,1fr) 1.6fr;grid-template-rows:1.6fr repeat(9,1fr) 1.6fr;
 background:#2b2b2b;border:2px solid #2b2b2b;gap:1px;border-radius:6px;overflow:hidden;flex:0 0 auto}
.cell{position:relative;background:#fbfdf8;display:flex;overflow:hidden;cursor:pointer;font-size:calc(var(--W)/66);line-height:1.08}
.cell.b{flex-direction:column}.cell.t{flex-direction:column-reverse}.cell.l{flex-direction:row-reverse}.cell.r{flex-direction:row}
.bar{flex:0 0 22%;display:flex;align-items:center;justify-content:center;font-size:calc(var(--W)/95);letter-spacing:-1px;overflow:hidden}
.cell.l .bar,.cell.r .bar{flex-direction:column;letter-spacing:0;line-height:1}
.txt{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;padding:2px 1px;overflow-wrap:break-word;hyphens:auto}
.cell.l .txt,.cell.r .txt{justify-content:center;gap:2px}
.nm{font-weight:500;width:100%;overflow-wrap:anywhere}
.pr{font-weight:700;color:#555}
.ic2{font-size:calc(var(--W)/40)}
.cn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2px;background:#fff4f9}
.cn .ic{font-size:calc(var(--W)/18)}
.cn .nm{font-weight:700;font-size:calc(var(--W)/52)}
.cn .sb{font-size:calc(var(--W)/72);color:#666}
.cell.mort .txt{opacity:.45}
.toks{position:absolute;left:0;right:0;bottom:1px;display:flex;flex-wrap:wrap;justify-content:center;gap:1px;pointer-events:none}
.tk{width:calc(var(--W)/30);height:calc(var(--W)/30);border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:calc(var(--W)/48);border:2px solid;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.center{grid-area:2/2/11/11;background:radial-gradient(circle at 50% 40%,#fff9fc,#ffe1ef);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--W)/60);text-align:center;padding:8px}
.logo{font-family:Lobster,cursive;font-size:calc(var(--W)/8.5);color:#e2479b;transform:rotate(-6deg);text-shadow:3px 3px 0 #fff,5px 5px 0 rgba(226,71,155,.25);line-height:1}
.subl{font-size:calc(var(--W)/40);color:#9a4f78}
.dice{display:flex;gap:calc(var(--W)/50)}
.die{width:calc(var(--W)/9);height:calc(var(--W)/9);background:#fff;border-radius:18%;box-shadow:0 2px 6px rgba(0,0,0,.25);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:12%}
.pip{width:70%;height:70%;margin:auto;border-radius:50%;background:#2a2230}
.turn{font-size:calc(var(--W)/30);font-weight:500}
.decks{display:flex;gap:calc(var(--W)/30)}
.deck{width:calc(var(--W)/6);height:calc(var(--W)/10);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:calc(var(--W)/38);transform:rotate(-8deg);box-shadow:0 2px 5px rgba(0,0,0,.2)}
.deck.ch{background:#f39321}.deck.cs{background:#e2479b;transform:rotate(8deg)}
.panel{flex:1 1 320px;max-width:420px;display:flex;flex-direction:column;gap:10px}
.box{background:#fff;border-radius:14px;padding:12px;box-shadow:0 2px 10px rgba(160,60,110,.12)}
.cur{display:flex;align-items:center;gap:10px}
.cur .big{font-size:30px}
.cur .nmb{font-weight:700;font-size:18px}
.money{font-weight:700;font-size:20px;margin-left:auto}
.status{font-size:14px;color:#7a3d60;margin-top:6px;min-height:1em}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{border:0;border-radius:12px;padding:12px 14px;font-size:16px;font-weight:500;background:#e2479b;color:#fff;cursor:pointer;flex:1 1 auto}
.btn.sec{background:#f6dce9;color:#7a2a55}
.btn.ok{background:#22a052}.btn.bad{background:#c62828}
.btn:disabled{opacity:.4;cursor:default}
.pl{display:flex;align-items:center;gap:8px;padding:6px 4px;border-left:5px solid;border-radius:4px;margin-bottom:6px;background:#fcf7fa}
.pl.on{background:#ffe4f1}.pl.out{opacity:.4;text-decoration:line-through}
.pl .m{margin-left:auto;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:3px;margin:0 0 8px 9px}
.chip{font-size:11px;padding:2px 6px;border-radius:8px;color:#fff;cursor:pointer;border:0}
.log{max-height:220px;overflow:auto;font-size:13px;line-height:1.4}
.log div{padding:3px 0;border-bottom:1px dashed #f0d6e3}
h3{margin:0 0 8px;font-size:15px;color:#9a4f78}
.ov{position:fixed;inset:0;background:rgba(40,20,35,.5);display:flex;align-items:center;justify-content:center;padding:14px;z-index:20}
.md{background:#fff;border-radius:16px;max-width:380px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.mh{padding:14px;color:#fff;font-weight:700;font-size:20px;text-align:center;border-radius:16px 16px 0 0}
.mb{padding:14px;font-size:15px;line-height:1.45}
.mb table{width:100%;border-collapse:collapse}.mb td{padding:3px 0}.mb td:last-child{text-align:right;font-weight:600}
.card-t{font-size:18px;text-align:center;padding:10px 4px 4px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#2a2230;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:90vw;text-align:center}
#setup{max-width:440px;margin:20px auto}
#setup .logo{font-size:64px;text-align:center;margin:10px 0 24px}
.row{display:flex;gap:8px;margin-bottom:8px}
.row input{flex:1;font-size:16px;padding:10px;border:2px solid #f0cfe0;border-radius:10px;font-family:inherit}
.row select{font-size:22px;border:2px solid #f0cfe0;border-radius:10px;background:#fff}
.nsel{display:flex;gap:6px;margin-bottom:12px}
.nsel button{flex:1;padding:10px 0;border-radius:10px;border:2px solid #f0cfe0;background:#fff;font-size:16px}
.nsel button.on{background:#e2479b;color:#fff;border-color:#e2479b}
.tr-col{margin-bottom:10px}.tr-col label{display:block;padding:4px 0}
.tr-col input[type=number]{width:100%;font-size:16px;padding:8px;border:2px solid #f0cfe0;border-radius:10px}
</style>
</head>
<body>
<div id="setup" style="display:none"></div>
<div id="app" style="display:none">
  <div class="board" id="board"></div>
  <div class="panel" id="panel"></div>
</div>
<div id="ov"></div>
<script>
const G={brown:['#8d5524',50],lb:['#7fd1f2',50],pink:['#e2479b',100],orange:['#f39321',100],red:['#e03b3b',150],yellow:['#f5d327',150],green:['#22a052',200],blue:['#2350a8',200]};
const st=(name,price,g,rent)=>({t:'street',name,price,g,rent});
const TAXI={t:'taxi',name:'Яндекс Такси',price:200,ic:'🚕'};
const CH={t:'chance',name:'Шанс',ic:'❓'}, CS={t:'chest',name:'Сплетни',ic:'💬'};
const SP=[
 {t:'go',name:'Старт',sub:'получи $200',ic:'➡️'},
 st('ГАИ',60,'brown',[2,10,30,90,160,250]),
 CS,
 st('1-я Челябинская',60,'brown',[4,20,60,180,320,450]),
 {t:'tax',name:'Коммуналка',amt:200,ic:'🧾'},
 TAXI,
 st('Шишка',100,'lb',[6,30,90,270,400,550]),
 CH,
 st('Солнечный',100,'lb',[6,30,90,270,400,550]),
 st('Майлина',120,'lb',[8,40,100,300,450,600]),
 {t:'jail',name:'Тюрьма',sub:'или просто в гостях',ic:'🔒'},
 st('Агромаш',140,'pink',[10,50,150,450,625,750]),
 {t:'util',name:'IQOS',price:150,ic:'💨'},
 st('Баян Сулу',140,'pink',[10,50,150,450,625,750]),
 st('КИнЭУ',160,'pink',[12,60,180,500,700,900]),
 TAXI,
 st('Mart',180,'orange',[14,70,200,550,750,950]),
 CS,
 st('Kostanay Plaza',180,'orange',[14,70,200,550,750,950]),
 st('Золотой фазан',200,'orange',[16,80,220,600,800,1000]),
 {t:'park',name:'Лавочка',sub:'просто отдыхай',ic:'🪑'},
 st('КЖБИ набережная',220,'red',[18,90,250,700,875,1050]),
 CH,
 st('Триатлон Парк',220,'red',[18,90,250,700,875,1050]),
 st('Центральный Парк',240,'red',[20,100,300,750,925,1100]),
 TAXI,
 st('Центральная набережная',260,'yellow',[22,110,330,800,975,1150]),
 st('Beermarket',260,'yellow',[22,110,330,800,975,1150]),
 {t:'util',name:'Одноразки',price:150,ic:'🔋'},
 st('Баден-Баден',280,'yellow',[24,120,360,850,1025,1200]),
 {t:'gotojail',name:'В тюрьму!',sub:'без $200',ic:'👮'},
 st('Качар',300,'green',[26,130,390,900,1100,1275]),
 st('Актобэ',300,'green',[26,130,390,900,1100,1275]),
 CS,
 st('Астана',320,'green',[28,150,450,1000,1200,1400]),
 TAXI,
 CH,
 st('Париж',350,'blue',[35,175,500,1100,1300,1500]),
 {t:'tax',name:'Новые ноготочки',amt:100,ic:'💅'},
 st('Форкс',400,'blue',[50,200,600,1400,1700,2000]),
];
const PASS=' Если проходишь Старт — получи $200.';
const CARDS={
chance:[
 {x:'Таксист знает короткий путь. Езжай на Старт и получи $200.',e:'move',to:0},
 {x:'Захотелось к вампирам. Отправляйся в Форкс.',e:'move',to:39},
 {x:'Пятница! Все в Beermarket.'+PASS,e:'move',to:27},
 {x:'Срочно нужен шопинг. Отправляйся в Kostanay Plaza.'+PASS,e:'move',to:18},
 {x:'Вечерняя прогулка. Иди на КЖБИ набережную.'+PASS,e:'move',to:21},
 {x:'Вызываем Яндекс Такси! Иди к ближайшему такси. Если у него есть владелец — заплати ему двойную аренду.',e:'near',k:'taxi'},
 {x:'Спонтанная поездка в Астану.'+PASS,e:'move',to:34},
 {x:'Хочешь курить. Иди к ближайшей клетке IQOS или Одноразки. Если у неё есть владелец — брось кубики и заплати 4× выпавшее. Если владелец владеет обеими карточками, тогда 10×.',e:'near',k:'util'},
 {x:'Нашлись деньги в кармане зимней куртки. Получи $50.',e:'money',v:50},
 {x:'Остановили на ГАИ без прав. Отправляйся прямо в Тюрьму, Старт не проходишь.',e:'jail'},
 {x:'Выход из тюрьмы бесплатно. Карточку можно оставить себе.',e:'goojf'},
 {x:'Вышли не на той остановке. Вернись на 3 клетки назад.',e:'back'},
 {x:'Ремонт после тусовки: заплати $25 за каждый дом и $100 за каждый отель.',e:'rep',h:25,o:100},
 {x:'Штраф за переход на красный на Майлина. Заплати $15.',e:'money',v:-15},
 {x:'Тебя выбрали старостой группы. Заплати каждому игроку по $50.',e:'payEach',v:50},
 {x:'Пришёл кэшбэк. Получи $150.',e:'money',v:150},
],
chest:[
 {x:'Таксист Альбины подвез до дома. Иди на Старт и получи $200.',e:'move',to:0},
 {x:'Банк ошибся в твою пользу. Получи $200.',e:'money',v:200},
 {x:'Маникюр сам себя не сделает. Заплати $50.',e:'money',v:-50},
 {x:'Старые вещи ушли на OLX. Получи $50.',e:'money',v:50},
 {x:'Выход из тюрьмы бесплатно. Карточку можно оставить себе.',e:'goojf'},
 {x:'Слишком громко сплетничали и Серик ругается. Отправляйся прямо в Тюрьму, Старт не проходишь.',e:'jail'},
 {x:'День рождения! Каждый игрок дарит тебе по $10.',e:'collect',v:10},
 {x:'Вернули долг, про который все давно забыли. Получи $100.',e:'money',v:100},
 {x:'Пересдача в КИнЭУ. Заплати $100.',e:'money',v:-100},
 {x:'Мама из Качара привезла еды. Получи $100.',e:'money',v:100},
 {x:'Доставка еды в 3 часа ночи. Заплати $50.',e:'money',v:-50},
 {x:'Пост набрал кучу лайков, пришла реклама. Получи $10.',e:'money',v:10},
 {x:'Премия на работе. Получи $25.',e:'money',v:25},
 {x:'Генеральная уборка: заплати $40 за каждый дом и $115 за каждый отель.',e:'rep',h:40,o:115},
 {x:'Нашлась скидка в Dodo. Получи $20.',e:'money',v:20},
 {x:'Закончились конфеты «Баян Сулу». Купи ещё: заплати $20.',e:'money',v:-20},
]};
const COLORS=['#e2479b','#2350a8','#22a052','#f39321','#8e44ad','#e03b3b','#16a5a5','#6d4c41'];
const TOKENS=['💅','🦊','🐱','☕','👑','🌸','🐻','🍕','🚗','🎧','🍓','🦄','⭐','🐸','🍩','🎀','🐶','🧛','🍎'];
const SAVE='lenapoly-v1';
let S=null,busy=false,T=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const r6=()=>1+Math.floor(Math.random()*6);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const P=()=>S.players[S.cur];
const grp=g=>SP.map((s,i)=>s.g===g?i:-1).filter(i=>i>=0);
const ownsAll=(o,g)=>grp(g).every(j=>S.props[j].owner===o);
const countType=(o,t)=>SP.filter((s,i)=>s.t===t&&S.props[i].owner===o).length;
function save(){try{localStorage.setItem(SAVE,JSON.stringify(S))}catch(e){}}
function log(m){S.log.unshift(m);S.log=S.log.slice(0,80)}
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}

/* ---------- setup ---------- */
let setupN=2;
let setupData=[{name:'Лена',token:'💅'},{name:'Игрок 2',token:'🦊'}];
function renderSetup(){
 $('app').style.display='none';$('setup').style.display='block';
 while(setupData.length<setupN)setupData.push({name:'Игрок '+(setupData.length+1),token:TOKENS[setupData.length]});
 let h=`<div class="logo">Ленаполия</div><div class="box"><h3>Сколько игроков?</h3><div class="nsel">`;
 for(let n=2;n<=8;n++)h+=`<button class="${n===setupN?'on':''}" data-n="${n}">${n}</button>`;
 h+=`</div><h3>Имена и фишки</h3>`;
 for(let i=0;i<setupN;i++){h+=`<div class="row"><select data-tk="${i}">${TOKENS.map(t=>`<option ${t===setupData[i].token?'selected':''}>${t}</option>`).join('')}</select><input data-nm="${i}" value="${esc(setupData[i].name)}" maxlength="14"></div>`}
 h+=`<div class="btns"><button class="btn" id="go">Начать игру</button></div></div>`;
 $('setup').innerHTML=h;
 $('setup').querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{readSetup();setupN=+b.dataset.n;renderSetup()});
 $('go').onclick=()=>{readSetup();newGame(setupData.slice(0,setupN))};
}
function readSetup(){$('setup').querySelectorAll('[data-nm]').forEach(e=>setupData[+e.dataset.nm].name=e.value.trim()||('Игрок '+(+e.dataset.nm+1)));$('setup').querySelectorAll('[data-tk]').forEach(e=>setupData[+e.dataset.tk].token=e.value)}
function newGame(list){
 S={players:list.map((p,i)=>({name:p.name,token:p.token,color:COLORS[i],money:1500,pos:0,inJail:false,jailTurns:0,cards:[],out:false,creditor:null})),
  props:{},cur:0,phase:'roll',dbl:0,dice:[3,4],canAgain:false,pendingBuy:null,log:[],winner:null,
  decks:{chance:shuffle([...Array(16).keys()]),chest:shuffle([...Array(16).keys()])}};
 SP.forEach((s,i)=>{if(s.price)S.props[i]={owner:null,houses:0,mort:false}});
 log(`Игра началась! Первым ходит ${S.players[0].name}.`);
 $('setup').style.display='none';$('app').style.display='flex';save();render();
}

/* ---------- money ---------- */
function pay(pi,amt,to){S.players[pi].money-=amt;if(to!=null)S.players[to].money+=amt;if(S.players[pi].money<0)S.players[pi].creditor=(to==null?null:to)}

/* ---------- movement ---------- */
async function stepMove(n){const p=P();for(let k=0;k<n;k++){p.pos=(p.pos+1)%40;if(p.pos===0){p.money+=200;log(`${p.name} проходит Старт: +$200`)}render();await sleep(130)}}
async function moveTo(t){await stepMove((t-P().pos+40)%40)}
function sendToJail(pi){const p=S.players[pi];p.pos=10;p.inJail=true;p.jailTurns=0;S.canAgain=false;S.dbl=0;log(`${p.name} отправляется в Тюрьму 🔒`)}

function rentOf(i,sum,opt={}){const s=SP[i],pr=S.props[i],o=pr.owner;if(pr.mort)return 0;
 if(s.t==='street')return pr.houses>0?s.rent[pr.houses]:s.rent[0]*(ownsAll(o,s.g)?2:1);
 if(s.t==='taxi'){let r=25*Math.pow(2,countType(o,'taxi')-1);return opt.double?r*2:r}
 if(s.t==='util')return sum*(opt.ten||countType(o,'util')===2?10:4);return 0}

async function land(sum,opt={}){const p=P(),i=p.pos,s=SP[i];
 if(s.price){const pr=S.props[i];
  if(pr.owner===null){S.pendingBuy=i;log(`${p.name} на «${s.name}» — можно купить за $${s.price}`)}
  else if(pr.owner!==S.cur){if(pr.mort)log(`«${s.name}» в залоге — аренды нет`);
   else{const r=rentOf(i,sum,opt);pay(S.cur,r,pr.owner);log(`${p.name} платит ${S.players[pr.owner].name} $${r} за «${s.name}»`)}}
  return}
 if(s.t==='tax'){pay(S.cur,s.amt,null);log(`${s.name}: ${p.name} платит $${s.amt}`)}
 else if(s.t==='chance'||s.t==='chest')await drawCard(s.t);
 else if(s.t==='gotojail')sendToJail(S.cur);
}
async function drawCard(kind){const id=S.decks[kind].shift(),c=CARDS[kind][id];
 render();await showCard(kind,c.x);if(c.e!=='goojf')S.decks[kind].push(id);
 const p=P();log(`${kind==='chance'?'Шанс':'Сплетни'}: ${c.x}`);
 switch(c.e){
  case 'money':if(c.v>0)p.money+=c.v;else pay(S.cur,-c.v,null);break;
  case 'move':await moveTo(c.to);await land(S.dice[0]+S.dice[1]);break;
  case 'near':{let t=p.pos;do{t=(t+1)%40}while(SP[t].t!==c.k);await moveTo(t);
   if(c.k==='util'){const pr=S.props[t];if(pr.owner!==null&&pr.owner!==S.cur&&!pr.mort){const a=r6(),b=r6();S.dice=[a,b];log(`Бросок для аренды: ${a}+${b}`);render();await sleep(400);await land(a+b)}else await land(0)}
   else await land(0,{double:true});break}
  case 'jail':sendToJail(S.cur);break;
  case 'goojf':p.cards.push(kind);break;
  case 'back':p.pos=(p.pos+37)%40;render();await sleep(200);await land(S.dice[0]+S.dice[1]);break;
  case 'rep':{let h=0,o=0;Object.values(S.props).forEach(pr=>{if(pr.owner===S.cur){if(pr.houses===5)o++;else h+=pr.houses}});const v=h*c.h+o*c.o;if(v)pay(S.cur,v,null);log(`${p.name} платит $${v} за ремонт`);break}
  case 'payEach':S.players.forEach((q,j)=>{if(j!==S.cur&&!q.out)pay(S.cur,c.v,j)});break;

async function roll(){if(busy||S.phase!=='roll'||S.pendingBuy!=null)return;const p=P();if(p.money<0){toast('Сначала погаси долг');return}
 busy=true;const a=r6(),b=r6(),d=a===b;S.dice=[a,b];render();await sleep(300);

 if(p.inJail){
  if(d){p.inJail=false;p.jailTurns=0;log(`Дубль — ${p.name} выходит из тюрьмы`);S.phase='moving';await stepMove(a+b);await land(a+b)}
  else{p.jailTurns++;if(p.jailTurns>=3){pay(S.cur,50,null);p.inJail=false;p.jailTurns=0;log(`Третья попытка — ${p.name} платит $50 и выходит`);S.phase='moving';await stepMove(a+b);await land(a+b)}else log(`Не дубль, ${p.name} остаётся в тюрьме`)}
  S.canAgain=false;S.phase='action';busy=false;save();render();return}
 if(d){S.dbl++;if(S.dbl===3){log('Три дубля подряд — это подозрительно!');sendToJail(S.cur);S.phase='action';busy=false;save();render();return}}
 S.canAgain=d;S.phase='moving';await stepMove(a+b);await land(a+b);
 if(P().inJail)S.canAgain=false;S.phase='action';busy=false;save();render();
}
function rollAgain(){if(busy)return;S.phase='roll';S.canAgain=false;roll()}
function payJail(){const p=P();if(p.money<50)return;pay(S.cur,50,null);p.inJail=false;p.jailTurns=0;log(`${p.name} платит $50 и выходит из тюрьмы`);save();render()}

function buy(){const i=S.pendingBuy,p=P(),s=SP[i];if(i==null||p.money<s.price)return;pay(S.cur,s.price,null);S.props[i].owner=S.cur;S.pendingBuy=null;log(`${p.name} покупает «${s.name}» за $${s.price}`);save();render()}
function decline(){const s=SP[S.pendingBuy];S.pendingBuy=null;log(`${P().name} не покупает «${s.name}»`);save();render()}
function endTurn(){if(busy||S.pendingBuy!=null)return;if(P().money<0){toast('Сначала погаси долг');return}
 S.dbl=0;S.canAgain=false;nextPlayer();save();render()}
function nextPlayer(){let n=S.cur;do{n=(n+1)%S.players.length}while(S.players[n].out);S.cur=n;S.phase='roll';S.dbl=0;S.canAgain=false;S.pendingBuy=null;
 const p=P();log(`Ход: ${p.name}${p.inJail?' (в тюрьме)':''}`)}
function bankrupt(){const pi=S.cur,p=P();if(p.money>=0)return;const cr=p.creditor;
 Object.keys(S.props).forEach(k=>{const pr=S.props[k];if(pr.owner===pi){p.money+=pr.houses*G[SP[k].g]?.[1]/2||0;pr.houses=0;
  if(cr!=null&&!S.players[cr].out)pr.owner=cr;else{pr.owner=null;pr.mort=false}}});
 if(cr!=null&&!S.players[cr].out&&p.money<0)S.players[cr].money+=p.money;
 p.cards.forEach(k=>S.decks[k].push(CARDS[k].findIndex(c=>c.e==='goojf')));p.cards=[];
 p.out=true;p.money=0;log(`💥 ${p.name} — банкрот${cr!=null?', всё имущество уходит к '+S.players[cr].name:''}`);
 const act=S.players.filter(q=>!q.out);if(act.length===1){S.winner=S.players.indexOf(act[0]);log(`🏆 ${act[0].name} побеждает!`);save();render();return}

const hcost=i=>G[SP[i].g][1];
function canBuild(i){const s=SP[i],pr=S.props[i];if(s.t!=='street'||pr.owner!==S.cur||pr.houses>=5)return false;const g=grp(s.g);
 if(!g.every(j=>S.props[j].owner===S.cur&&!S.props[j].mort))return false;return pr.houses===Math.min(...g.map(j=>S.props[j].houses))&&P().money>=hcost(i)}
function canSell(i){const s=SP[i],pr=S.props[i];if(s.t!=='street'||pr.owner!==S.cur||pr.houses===0)return false;return pr.houses===Math.max(...grp(s.g).map(j=>S.props[j].houses))}

 if(act==='build'&&canBuild(i)){pay(S.cur,hcost(i),null);pr.houses++;log(`${p.name} строит ${pr.houses===5?'отель':'дом'} на «${s.name}»`)}
