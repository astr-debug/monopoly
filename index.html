<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ленаполия</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lobster&family=Oswald:wght@500;600;700&family=Lora:ital,wght@0,500;0,700;1,700&family=Montserrat:wght@500;600;800&family=Inter:wght@500;600;800&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Rubik,system-ui,sans-serif;background:#fdf1f6;color:#2a2230;padding:8px}
button{font-family:inherit}
#app{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:flex-start}
.board{--W:min(calc(100vw - 16px),88vh,760px);--u:calc(var(--W)/12.2);--bg:#cfe6cf;width:var(--W);height:var(--W);display:grid;
 grid-template-columns:1.6fr repeat(9,1fr) 1.6fr;grid-template-rows:1.6fr repeat(9,1fr) 1.6fr;
 background:#1d1d1d;border:3px solid #1d1d1d;gap:1px;flex:0 0 auto;font-family:Oswald,'Arial Narrow',Rubik,sans-serif;color:#1d1d1d;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.cell{position:relative;background:var(--bg);overflow:hidden;cursor:pointer;container-type:size}
.in{position:absolute;left:50%;top:50%;width:100cqw;height:100cqh;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;text-align:center}
.cell.l .in{width:100cqh;height:100cqw;transform:translate(-50%,-50%) rotate(90deg)}
.cell.t .in{transform:translate(-50%,-50%) rotate(180deg)}
.cell.r .in{width:100cqh;height:100cqw;transform:translate(-50%,-50%) rotate(-90deg)}
.bar{flex:0 0 22%;width:100%;border-bottom:1px solid #1d1d1d;display:flex;align-items:center;justify-content:center;gap:4%}
.hs{width:15%;height:52%;background:#1f9d48;border:1px solid #0b4d22;border-radius:1px}
.ht{width:34%;height:58%;background:#d71920;border:1px solid #5c0a0d;border-radius:1px}
.nm{width:100%;padding:4% 5% 0;font-weight:600;text-transform:uppercase;line-height:1.08;font-size:calc(var(--u)/5.2);overflow-wrap:normal;letter-spacing:.01em}
.pr{margin-top:auto;padding-bottom:5%;font-weight:500;font-size:calc(var(--u)/5.6)}
.ic2{margin:auto 0;font-size:calc(var(--u)/2.6);line-height:1}
.q{margin:auto 0;font-weight:700;font-size:calc(var(--u)/1.35);line-height:1;color:#d6336c;-webkit-text-stroke:1px #1d1d1d}
.cell.mort .in{opacity:.4}
.cell.owned{box-shadow:inset 0 0 0 3px var(--own)}
.cell.mort::after{content:'ЗАЛОГ';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-30deg);font-weight:700;font-size:calc(var(--u)/4.5);color:#b00020;border:1.5px solid #b00020;padding:0 3px;background:rgba(255,255,255,.7)}
.cin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;text-transform:uppercase;font-weight:700;line-height:1.05}
.cin .ic{font-size:calc(var(--u)/2.3);line-height:1.15}
.cin .nm2{font-size:calc(var(--u)/4.4)}
.cin .sb{font-size:calc(var(--u)/7);font-weight:500}
.jail{position:absolute;top:0;right:0;width:66%;height:66%;background:#f39321;border-left:1px solid #1d1d1d;border-bottom:1px solid #1d1d1d;overflow:hidden}
.jail .cin{transform:rotate(45deg)}.jail .cin .ic{font-size:calc(var(--u)/3.2)}.jail .cin .nm2{font-size:calc(var(--u)/6)}
.jail .bars{position:absolute;inset:18%;background:repeating-linear-gradient(90deg,transparent 0 16%,#1d1d1d 16% 22%);opacity:.18}
.vis{position:absolute;font-weight:700;font-size:calc(var(--u)/5.5);text-transform:uppercase;display:flex;align-items:center;justify-content:center}
.vis.lft{left:0;top:0;width:34%;height:66%}.vis.lft span{transform:rotate(90deg);white-space:nowrap}
.vis.bot{left:0;bottom:0;width:100%;height:34%}
.toks{position:absolute;inset:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;align-content:center;gap:1px;pointer-events:none}
.tk{width:calc(var(--u)/2);height:calc(var(--u)/2);border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:calc(var(--u)/3.3);border:2px solid;box-shadow:0 1px 3px rgba(0,0,0,.45)}
.center{grid-area:2/2/11/11;background:var(--bg);position:relative;overflow:hidden}
.banner{position:absolute;left:50%;top:50%;width:76%;transform:translate(-50%,-50%) rotate(-45deg);background:#d6336c;color:#fff;font-weight:700;font-size:calc(var(--u)*.95);letter-spacing:.05em;text-align:center;line-height:1;padding:.14em 0 .18em;border:calc(var(--u)/14) solid #fff;outline:2px solid #1d1d1d;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.slot{position:absolute;width:calc(var(--u)*2.9);height:calc(var(--u)*1.9);border:2px dashed #1d1d1d;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:600;text-transform:uppercase;font-size:calc(var(--u)/3.4);gap:2px;background:rgba(255,255,255,.3)}
.slot b{font-size:calc(var(--u)/1.8);line-height:1}
.slot.cs{left:9%;top:13%;transform:rotate(135deg)}.slot.ch{right:9%;bottom:13%;transform:rotate(-45deg)}
.slot.ch b{color:#d6336c}
.cdice{position:absolute;right:5%;top:6%;display:flex;gap:calc(var(--u)/6)}
.die{width:calc(var(--u)*.85);height:calc(var(--u)*.85);background:#fff;border-radius:18%;box-shadow:0 2px 5px rgba(0,0,0,.3);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:12%}
.pip{width:70%;height:70%;margin:auto;border-radius:50%;background:#1d1d1d}
.cturn{position:absolute;left:5%;bottom:6%;display:flex;flex-direction:column;align-items:center;font-weight:600;font-size:calc(var(--u)/3.6);text-transform:uppercase;max-width:calc(var(--u)*2.3);text-align:center;line-height:1.1}
.cturn .tk{width:calc(var(--u)*.85);height:calc(var(--u)*.85);font-size:calc(var(--u)/1.9);margin-bottom:3px}
.panel{flex:1 1 320px;max-width:420px;display:flex;flex-direction:column;gap:10px}
.box{background:#fff;border-radius:14px;padding:12px;box-shadow:0 2px 10px rgba(160,60,110,.12)}
.cur{display:flex;align-items:center;gap:10px}
.cur .big{font-size:30px}
.cur .nmb{font-weight:700;font-size:18px}
.money{font-weight:700;font-size:20px;margin-left:auto}
.status{font-size:14px;color:#7a3d60;margin-top:6px;min-height:1em}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{border:0;border-radius:12px;padding:12px 14px;font-size:16px;font-weight:500;background:#e2479b;color:#fff;cursor:pointer;flex:1 1 auto}
.btn.sec{background:#f6dce9;color:#7a2a55}
.btn.ok{background:#22a052}.btn.bad{background:#c62828}
.btn:disabled{opacity:.4;cursor:default}
.pl{display:flex;align-items:center;gap:8px;padding:6px 4px;border-left:5px solid;border-radius:4px;margin-bottom:6px;background:#fcf7fa}
.pl.on{background:#ffe4f1}.pl.out{opacity:.4;text-decoration:line-through}
.pl .m{margin-left:auto;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:3px;margin:0 0 8px 9px}
.chip{font-size:11px;padding:2px 6px;border-radius:8px;color:#fff;cursor:pointer;border:0}
.log{max-height:220px;overflow:auto;font-size:13px;line-height:1.4}
.log div{padding:3px 0;border-bottom:1px dashed #f0d6e3}
h3{margin:0 0 8px;font-size:15px;color:#9a4f78}
.ov{position:fixed;inset:0;background:rgba(40,20,35,.5);display:flex;align-items:center;justify-content:center;padding:14px;z-index:20}
.md{background:#fff;border-radius:16px;max-width:380px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.mh{padding:14px;color:#fff;font-weight:700;font-size:20px;text-align:center;border-radius:16px 16px 0 0}
.mb{padding:14px;font-size:15px;line-height:1.45}
.mb table{width:100%;border-collapse:collapse}.mb td{padding:3px 0}.mb td:last-child{text-align:right;font-weight:600}
.card-t{font-size:18px;text-align:center;padding:10px 4px 4px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#2a2230;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:90vw;text-align:center}
#setup{max-width:440px;margin:20px auto}
#setup .logo{font-family:Lobster,cursive;color:#e2479b;transform:rotate(-6deg);font-size:64px;text-align:center;margin:10px 0 24px}
.row{display:flex;gap:8px;margin-bottom:8px}
.row input{flex:1;font-size:16px;padding:10px;border:2px solid #f0cfe0;border-radius:10px;font-family:inherit}
.row select{font-size:22px;border:2px solid #f0cfe0;border-radius:10px;background:#fff}
.nsel{display:flex;gap:6px;margin-bottom:12px}
.nsel button{flex:1;padding:10px 0;border-radius:10px;border:2px solid #f0cfe0;background:#fff;font-size:16px}
.nsel button.on{background:#e2479b;color:#fff;border-color:#e2479b}
.tr-col{margin-bottom:10px}.tr-col label{display:block;padding:4px 0}
.tr-col input[type=number]{width:100%;font-size:16px;padding:8px;border:2px solid #f0cfe0;border-radius:10px}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1;padding:12px 6px;border-radius:12px;border:2px solid #f0cfe0;background:#fff;font-size:15px;font-family:inherit;cursor:pointer}.tabs button.on{background:#e2479b;color:#fff;border-color:#e2479b}
.qrbox{background:#fff;border-radius:14px;padding:10px;display:flex;justify-content:center}.qrbox svg{width:min(70vw,300px);height:auto}
.link{font-size:13px;word-break:break-all;background:#fdf1f6;padding:8px;border-radius:8px;margin-top:8px;user-select:all}
.lob{display:flex;align-items:center;gap:8px;padding:8px;border-radius:10px;background:#fcf7fa;margin-bottom:6px;font-size:17px}.lob .x{margin-left:auto;border:0;background:none;font-size:18px;cursor:pointer}
#client{max-width:480px;margin:0 auto}
.me{display:flex;align-items:center;gap:12px}.me .big{font-size:44px}.me .nmb{font-weight:700;font-size:20px}.me .money{margin-left:auto;font-size:26px;font-weight:700}
.turnbar{margin-top:8px;padding:8px 10px;border-radius:10px;background:#f3e6ee;font-weight:500}.turnbar.my{background:#22a052;color:#fff}
.mydice{display:flex;gap:8px;justify-content:center;margin:10px 0}.mydice .die{width:46px;height:46px;padding:6px}
.prow{display:flex;align-items:center;gap:8px;padding:9px 8px;border-radius:10px;background:#fcf7fa;margin-bottom:6px;cursor:pointer}.prow .sw{width:10px;align-self:stretch;border-radius:4px}.prow .r{margin-left:auto;font-size:13px;color:#7a3d60}
.tokpick{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:8px 0}.tokpick button{font-size:24px;padding:6px 0;border-radius:10px;border:2px solid #f0cfe0;background:#fff;cursor:pointer}.tokpick button.on{border-color:#e2479b;background:#ffe4f1}.tokpick button:disabled{opacity:.3}
.debt{background:#ffe6e6;color:#8a1c1c;padding:8px 10px;border-radius:10px;font-size:15px;margin-top:8px}
.win{position:fixed;inset:0;z-index:50;background:rgba(20,8,30,.82);display:flex;align-items:center;justify-content:center}
.win canvas{position:absolute;inset:0;width:100%;height:100%}
.win .wbox{position:relative;text-align:center;color:#fff;padding:20px;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.win .wt{font-family:Lobster,cursive;font-size:clamp(40px,9vw,96px);line-height:1.05;text-shadow:0 4px 0 #e2479b,0 0 30px rgba(255,105,180,.8)}
.win .wtok{font-size:clamp(60px,14vw,140px);animation:bob 1.2s ease-in-out infinite}
.win .ws{font-size:clamp(16px,3vw,24px);margin:8px 0 18px;opacity:.9}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes bob{50%{transform:translateY(-12px) rotate(-6deg)}}
.cboard{--W:min(calc(100vw - 16px),480px,72vh);margin:8px auto 0}
.bov{position:fixed;inset:0;z-index:15;background:#fdf1f6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:8px;overflow:auto}
.colpick{display:flex;flex-wrap:wrap;gap:9px;margin:8px 0}.colpick button{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #e6d3de;cursor:pointer;padding:0}.colpick button.on{box-shadow:0 0 0 3px #2a2230;transform:scale(1.12)}.colpick button:disabled{opacity:.15;cursor:default}
.colpick.sm{gap:6px;margin:2px 0 10px}.colpick.sm button{width:24px;height:24px;border-width:2px}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:middle;margin-right:2px}


.tk.hop{animation:hop .2s ease-out}
@keyframes hop{0%{transform:translateY(-45%) scale(1.2)}100%{transform:none}}
.dice-ph{height:var(--dsz);width:calc(var(--dsz)*2.3)}
.cdice .dice-ph{--dsz:calc(var(--u)*.85)}.mydice .dice-ph{--dsz:46px;margin:0 auto}
.dice3{position:absolute;z-index:12;display:flex;justify-content:space-between;align-items:center;pointer-events:none;perspective:calc(var(--ds)*8)}
.dice3 .cube{position:relative;width:var(--ds);height:var(--ds);transform-style:preserve-3d;will-change:transform}
.dice3 .face{position:absolute;inset:0;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:14%;border-radius:18%;background:#fff;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);backface-visibility:hidden}
.dice3 .pip{width:72%;height:72%}
.dice3 .f1{transform:translateZ(calc(var(--ds)/2))}.dice3 .f6{transform:rotateY(180deg) translateZ(calc(var(--ds)/2))}
.dice3 .f3{transform:rotateY(90deg) translateZ(calc(var(--ds)/2))}.dice3 .f4{transform:rotateY(-90deg) translateZ(calc(var(--ds)/2))}
.dice3 .f2{transform:rotateX(90deg) translateZ(calc(var(--ds)/2))}.dice3 .f5{transform:rotateX(-90deg) translateZ(calc(var(--ds)/2))}
.dice3.throw{animation:throw 1.15s cubic-bezier(.2,.8,.3,1) both}
.dice3.dk-my.throw{animation-name:throwS}
@keyframes throw{0%{transform:translate(-120%,-70%) scale(.55);opacity:0}12%{opacity:1}55%{transform:translate(6%,8%) scale(1.06)}75%{transform:translate(-2%,-10%) scale(1)}90%{transform:translate(0,2%)}100%{transform:none;opacity:1}}
@keyframes throwS{0%{transform:translateY(-90%) scale(.6);opacity:0}15%{opacity:1}55%{transform:translateY(8%) scale(1.06)}75%{transform:translateY(-14%)}90%{transform:translateY(2%)}100%{transform:none;opacity:1}}
.dice3.th-neon .face{background:linear-gradient(145deg,#1f2350,#0c0e22);box-shadow:inset 0 0 0 1.5px rgba(95,243,255,.85),inset 0 0 10px rgba(95,243,255,.35)}
.dice3.th-neon .pip{background:#7ff6ff;box-shadow:0 0 4px #5ff3ff}

/* ---- иконки мест ---- */
.pic{display:flex;justify-content:center;margin:auto 0 0}.pic .sic{width:calc(var(--u)*.36);height:calc(var(--u)*.36)}
.th-neon .cell .pr{margin-top:4%}
/* ---- фишки-слой ---- */
.toklayer{position:absolute;left:0;top:0;width:0;height:0;z-index:11;pointer-events:none}
.toklayer .tk{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#fff;border:2px solid;box-shadow:0 2px 6px rgba(0,0,0,.45);will-change:left,top}
.toklayer.th-neon .tk{background:#0b0c18;box-shadow:0 0 6px var(--pc),0 0 16px var(--pc)}
.toklayer .tk.cur{animation:tkpulse 1.4s ease-in-out infinite}
@keyframes tkpulse{50%{transform:scale(1.12)}}
/* ---- эффекты ---- */
.fxflash{position:absolute;z-index:10;pointer-events:none;border-radius:4px;animation:fxflash 1.2s ease-out forwards;box-shadow:inset 0 0 0 3px var(--fc),0 0 24px var(--fc),inset 0 0 30px var(--fc)}
@keyframes fxflash{0%{opacity:0;transform:scale(1.3)}15%{opacity:1;transform:scale(1)}100%{opacity:0}}
.fxtxt{position:absolute;z-index:14;pointer-events:none;transform:translate(-50%,-50%);font-family:Montserrat,Rubik,sans-serif;font-weight:800;white-space:nowrap;animation:fxup 1.5s cubic-bezier(.2,.7,.3,1) forwards}
.fxtxt.small{font-size:20px}
.fxtxt.plus{color:#3dff8a;text-shadow:0 0 6px #3dff8a,0 0 16px rgba(61,255,138,.7),0 2px 0 #063}
.fxtxt.minus{color:#ff4f6e;text-shadow:0 0 6px #ff4f6e,0 0 16px rgba(255,79,110,.7),0 2px 0 #500}
@keyframes fxup{0%{opacity:0;transform:translate(-50%,-20%) scale(.6)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}30%{transform:translate(-50%,-70%) scale(1)}100%{opacity:0;transform:translate(-50%,-220%)}}
.fxcoin{position:absolute;z-index:13;pointer-events:none;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6b0,#ffc531 45%,#c78a00);box-shadow:0 0 8px #ffd23f;animation:coin 1.1s cubic-bezier(.2,.7,.4,1) forwards}
@keyframes coin{0%{transform:translate(0,0) scale(.4);opacity:0}15%{opacity:1}70%{transform:translate(var(--dx),var(--dy)) scale(1)}100%{transform:translate(var(--dx),calc(var(--dy) + 30px)) scale(.6);opacity:0}}
.money.bump{animation:bump .5s ease}
@keyframes bump{40%{transform:scale(1.18)}}
/* ---- летящие карточки ---- */
.md.cardmd{background:none!important;box-shadow:none!important;overflow:visible;max-width:340px}
.fcard{width:min(78vw,300px);aspect-ratio:.7;margin:0 auto;perspective:1100px;animation:flyA .6s cubic-bezier(.2,.8,.3,1.08) both}
.fcard.chance{animation-name:flyB}
@keyframes flyA{0%{transform:translate(-55vw,-45vh) rotate(-40deg) scale(.3);opacity:0}25%{opacity:1}100%{transform:none}}
@keyframes flyB{0%{transform:translate(55vw,45vh) rotate(40deg) scale(.3);opacity:0}25%{opacity:1}100%{transform:none}}
.fin{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:flip .7s .5s cubic-bezier(.3,.7,.3,1) both}
@keyframes flip{from{transform:rotateY(180deg)}to{transform:rotateY(0)}}
.fface{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;display:flex;flex-direction:column;align-items:center;overflow:hidden}
.ffront{background:#fff;color:#2a2230;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.fback{transform:rotateY(180deg);justify-content:center;gap:10px;background:linear-gradient(135deg,#f39321,#e2479b);color:#fff;font-weight:800;font-size:22px;letter-spacing:.1em;text-transform:uppercase}
.fcard.chest .fback{background:linear-gradient(135deg,#e2479b,#8e44ad)}
.fback .fbig{font-size:70px;line-height:1}.fback .fbig .nic{width:90px;height:90px}
.fhead{display:flex;align-items:center;gap:8px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;font-size:15px}.fhead .nic{width:26px;height:26px}
.ftext{flex:1;display:flex;align-items:center;text-align:center;font-size:clamp(18px,5vw,22px);font-weight:600;line-height:1.3}
.ffoot{font-size:11px;letter-spacing:.4em;opacity:.5}
.thp-neon .ffront{background:linear-gradient(160deg,#1c1f45,#0b0c1d);color:#fff;box-shadow:0 0 0 1.5px var(--cc),0 0 30px var(--cc),inset 0 0 40px rgba(0,0,0,.4)}
.thp-neon .fcard{--cc:#5ff3ff}.thp-neon .fcard.chance{--cc:#ff4fd8}
.thp-neon .fhead{color:var(--cc);text-shadow:0 0 10px var(--cc)}
.thp-neon .fback{background:radial-gradient(circle at 50% 40%,#2a1d5c,#0b0c1d);box-shadow:0 0 0 1.5px var(--cc),0 0 30px var(--cc);color:var(--cc);text-shadow:0 0 12px var(--cc)}
.thp-neon .fback .nic{filter:drop-shadow(0 0 4px currentColor) drop-shadow(0 0 14px currentColor)}
/* ---- карточки мест ---- */
.md.deed{animation:deedin .5s cubic-bezier(.2,.8,.3,1.1) both;transform-origin:50% 60%}
@keyframes deedin{from{transform:perspective(900px) rotateY(-80deg) scale(.8);opacity:0}to{transform:none;opacity:1}}
.deedh{display:flex;flex-direction:column;align-items:center;gap:2px;padding:18px 14px!important;position:relative}
.deedh small{font-size:11px;letter-spacing:.3em;text-transform:uppercase;opacity:.85;font-weight:600}
.deedic{font-size:34px;line-height:1}.deedic .nic{width:44px;height:44px}

const countType=(o,t)=>SP.filter((s,i)=>s.t===t&&S.props[i].owner===o).length;
function save(){try{localStorage.setItem(SAVE,JSON.stringify(S))}catch(e){}}
function log(m){S.log.unshift(m);S.log=S.log.slice(0,80)}

 while(setupData.length<setupN)setupData.push({name:'Игрок '+(setupData.length+1),token:TOKENS[setupData.length],color:firstFree(setupData.map(x=>x.color))});
 let h=`<div class="logo">Ленаполия</div><div class="tabs"><button data-mode="net">💻 Поле на ноутбуке</button><button data-mode="phones">📲 Только телефоны</button><button class="on">🖥 Один экран</button></div><div class="box"><h3>Сколько игроков?</h3><div class="nsel">`;

function readSetup(){$('setup').querySelectorAll('[data-nm]').forEach(e=>setupData[+e.dataset.nm].name=e.value.trim()||('Игрок '+(+e.dataset.nm+1)));$('setup').querySelectorAll('[data-tk]').forEach(e=>setupData[+e.dataset.tk].token=e.value)}
function newGame(list,net){
 S={players:list.map((p,i)=>({name:p.name,token:p.token,color:p.color||COLORS[i],money:1500,pos:0,inJail:false,jailTurns:0,cards:[],shields:[],skip:0,out:false,creditor:null})),
  props:{},cur:0,phase:'roll',dbl:0,dice:[3,4],canAgain:false,pendingBuy:null,log:[],winner:null,
  decks:{chance:shuffle([...CARDS.chance.keys()]),chest:shuffle([...CARDS.chest.keys()])},extra:false};
 SP.forEach((s,i)=>{if(s.price)S.props[i]={owner:null,houses:0,mort:false}});
 if(net){S.net=true;S.room=NET.room;S.keys=list.map(l=>l.key);S.bc=NET.bc;S.broker=NET.broker}
 log(`Игра началась! Первым ходит ${S.players[0].name}.`);
 $('setup').style.display='none';$('app').style.display='flex';save();render();
}

/* ---------- money ---------- */
function pay(pi,amt,to){S.players[pi].money-=amt;if(to!=null)S.players[to].money+=amt;if(S.players[pi].money<0)S.players[pi].creditor=(to==null?null:to)}

/* ---------- movement ---------- */
async function stepMove(n){const p=P();for(let k=0;k<n;k++){p.pos=(p.pos+1)%40;if(p.pos===0){p.money+=200;addFx('go',0,200);log(`${p.name} проходит Старт: +200 Ł`)}render();await sleep(130)}}
async function moveTo(t){await stepMove((t-P().pos+40)%40)}
function sendToJail(pi){const p=S.players[pi];p.pos=10;p.inJail=true;p.jailTurns=0;S.canAgain=false;S.dbl=0;log(`${p.name} отправляется в Тюрьму 🔒`)}

function rentOf(i,sum,opt={}){const s=SP[i],pr=S.props[i],o=pr.owner;if(pr.mort)return 0;
 if(s.t==='street')return pr.houses>0?s.rent[pr.houses]:s.rent[0]*(ownsAll(o,s.g)?2:1);
 if(s.t==='taxi'){let r=25*Math.pow(2,countType(o,'taxi')-1);return opt.double?r*2:r}
 if(s.t==='util')return sum*(opt.ten||countType(o,'util')===2?10:4);return 0}

async function land(sum,opt={}){const p=P(),i=p.pos,s=SP[i];
 if(s.price){const pr=S.props[i];
  if(pr.owner===null){S.pendingBuy=i;log(`${p.name} на «${s.name}» — можно купить за ${M(s.price)}`)}
  else if(pr.owner!==S.cur){if(pr.mort)log(`«${s.name}» в залоге — аренды нет`);
   else{const r=rentOf(i,sum,opt);pay(S.cur,r,pr.owner);addFx('rent',i,-r,pr.owner);log(`${p.name} платит ${S.players[pr.owner].name} ${M(r)} за «${s.name}»`)}}
  return}
 if(s.t==='tax'){log(`${s.name}: ${M(s.amt)}`);const m0=p.money;await fine(s.amt);if(p.money<m0)addFx('tax',i,-s.amt)}
 else if(s.t==='chance'||s.t==='chest')await drawCard(s.t);
 else if(s.t==='gotojail')sendToJail(S.cur);
}
async function drawCard(kind){const id=S.decks[kind].shift(),c=CARDS[kind][id];
 render();await showCard(kind,c.x);if(c.e!=='goojf'&&c.e!=='shield')S.decks[kind].push(id);
 const p=P();log(`${kind==='chance'?'Шанс':'Сплетни'}: ${c.x}`);
 switch(c.e){
  case 'money':if(c.v>0){p.money+=c.v;addFx('gain',p.pos,c.v)}else{const m0=p.money;await fine(-c.v);if(p.money<m0)addFx('fine',p.pos,c.v)}break;
  case 'move':await moveTo(c.to);await land(S.dice[0]+S.dice[1]);break;
  case 'near':{let t=p.pos;do{t=(t+1)%40}while(SP[t].t!==c.k);await moveTo(t);
   if(c.k==='util'){const pr=S.props[t];if(pr.owner!==null&&pr.owner!==S.cur&&!pr.mort){const a=r6(),b=r6();S.dice=[a,b];S.rollId=(S.rollId||0)+1;log(`Бросок для аренды: ${a}+${b}`);render();await sleep(1000);await land(a+b)}else await land(0)}
   else await land(0,{double:true});break}
  case 'jail':sendToJail(S.cur);break;
  case 'goojf':p.cards.push(kind);break;
  case 'shield':p.shields.push([kind,id]);log(`${p.name} получает карточку отмены штрафа`);break;
  case 'skip':p.skip=(p.skip||0)+1;log(`${p.name} пропустит следующий ход`);break;
  case 'extra':S.extra=true;log(`${p.name} получает дополнительный ход`);break;
  case 'back':p.pos=(p.pos+37)%40;render();await sleep(200);await land(S.dice[0]+S.dice[1]);break;
  case 'rep':{let h=0,o=0;Object.values(S.props).forEach(pr=>{if(pr.owner===S.cur){if(pr.houses===5)o++;else h+=pr.houses}});const v=h*c.h+o*c.o;log(`Ремонт: ${M(v)}`);if(v)await fine(v);break}
  case 'payEach':S.players.forEach((q,j)=>{if(j!==S.cur&&!q.out)pay(S.cur,c.v,j)});break;
  case 'collect':S.players.forEach((q,j)=>{if(j!==S.cur&&!q.out)pay(j,c.v,S.cur)});break;
 }
}

async function fine(v){const p=P();if(p.shields&&p.shields.length){const use=await askShield(v);if(use){const [k,id]=p.shields.pop();S.decks[k].push(id);log(`${p.name} отменяет штраф ${M(v)} карточкой 🛡️`);return}}pay(S.cur,v,null)}
function askShield(v){return ask(S.cur,'shield',{v},done=>{modal(`<div class="mh" style="background:#22a052">🛡️ Отменить штраф?</div><div class="mb"><p>${esc(P().name)}: штраф ${M(v)}. Есть карточка отмены штрафа.</p><div class="btns"><button class="btn ok" id="sy">Отменить штраф</button><button class="btn sec" id="sn">Заплатить</button></div></div>`);$('ovb').dataset.lock=1;$('sy').onclick=()=>done(true);$('sn').onclick=()=>done(false)})}
/* ---------- turn actions ---------- */
async function roll(){if(busy||PR||S.phase!=='roll'||S.pendingBuy!=null)return;const p=P();if(p.money<0){toast('Сначала погаси долг');return}
 busy=true;const a=r6(),b=r6(),d=a===b;S.dice=[a,b];S.rollId=(S.rollId||0)+1;render();await sleep(1000);
 log(`${p.name} бросает ${a}+${b}${d?' — дубль!':''}`);
 if(p.inJail){
  if(d){p.inJail=false;p.jailTurns=0;log(`Дубль — ${p.name} выходит из тюрьмы`);S.phase='moving';await stepMove(a+b);await land(a+b)}
  else{p.jailTurns++;if(p.jailTurns>=3){pay(S.cur,50,null);p.inJail=false;p.jailTurns=0;log(`Третья попытка — ${p.name} платит 50 Ł и выходит`);S.phase='moving';await stepMove(a+b);await land(a+b)}else log(`Не дубль, ${p.name} остаётся в тюрьме`)}
  S.canAgain=false;if(S.extra){S.extra=false;if(!P().inJail)S.canAgain=true}S.phase='action';busy=false;save();render();return}
 if(d){S.dbl++;if(S.dbl===3){log('Три дубля подряд — это подозрительно!');sendToJail(S.cur);S.phase='action';busy=false;save();render();return}}
 S.canAgain=d;S.phase='moving';await stepMove(a+b);await land(a+b);
 if(S.extra){S.extra=false;S.canAgain=true}if(P().inJail)S.canAgain=false;S.phase='action';busy=false;save();render();
}
function rollAgain(){if(busy||PR)return;S.phase='roll';S.canAgain=false;roll()}
function payJail(){const p=P();if(busy||PR||S.phase!=='roll'||!p.inJail||p.money<50)return;pay(S.cur,50,null);p.inJail=false;p.jailTurns=0;log(`${p.name} платит 50 Ł и выходит из тюрьмы`);save();render()}
function useCard(){const p=P();if(busy||PR||S.phase!=='roll'||!p.inJail||!p.cards.length)return;const k=p.cards.pop();S.decks[k].push(CARDS[k].findIndex(c=>c.e==='goojf'));p.inJail=false;p.jailTurns=0;log(`${p.name} использует карточку «Выход из тюрьмы»`);save();render()}
function buy(){if(PR)return;const i=S.pendingBuy,p=P(),s=SP[i];if(i==null||p.money<s.price)return;pay(S.cur,s.price,null);S.props[i].owner=S.cur;S.pendingBuy=null;addFx('buy',i,-s.price,S.cur);log(`${p.name} покупает «${s.name}» за ${M(s.price)}`);save();render()}
function decline(){if(PR||S.pendingBuy==null)return;const s=SP[S.pendingBuy];S.pendingBuy=null;log(`${P().name} не покупает «${s.name}»`);save();render()}
function endTurn(){if(busy||PR||S.pendingBuy!=null)return;if(P().money<0){toast('Сначала погаси долг');return}
 S.dbl=0;S.canAgain=false;nextPlayer();save();render()}
function nextPlayer(){let n=S.cur;for(;;){n=(n+1)%S.players.length;const q=S.players[n];if(q.out)continue;if(q.skip>0){q.skip--;log(`${q.name} пропускает ход`);continue}break}S.cur=n;S.phase='roll';S.dbl=0;S.canAgain=false;S.pendingBuy=null;
 const p=P();log(`Ход: ${p.name}${p.inJail?' (в тюрьме)':''}`)}
function bankrupt(){if(busy||PR)return;const pi=S.cur,p=P();if(p.money>=0)return;if(debtOpts(pi).length){toast('Сначала продай дома и заложи места');return}const cr=p.creditor;
 Object.keys(S.props).forEach(k=>{const pr=S.props[k];if(pr.owner===pi){p.money+=pr.houses*G[SP[k].g]?.[1]/2||0;pr.houses=0;
  if(cr!=null&&!S.players[cr].out)pr.owner=cr;else{pr.owner=null;pr.mort=false}}});
 if(cr!=null&&!S.players[cr].out&&p.money<0)S.players[cr].money+=p.money;
 p.cards.forEach(k=>S.decks[k].push(CARDS[k].findIndex(c=>c.e==='goojf')));p.cards=[];(p.shields||[]).forEach(([k,id])=>S.decks[k].push(id));p.shields=[];
 p.out=true;p.money=0;log(`💥 ${p.name} — банкрот${cr!=null?', всё имущество уходит к '+S.players[cr].name:''}`);
 const act=S.players.filter(q=>!q.out);if(act.length===1){S.winner=S.players.indexOf(act[0]);log(`🏆 ${act[0].name} побеждает!`);save();render();return}
 nextPlayer();save();render()}

/* ---------- property management ---------- */
const hcost=i=>G[SP[i].g][1];
function canBuild(i){const s=SP[i],pr=S.props[i];if(s.t!=='street'||pr.owner!==S.cur||pr.houses>=5)return false;const g=grp(s.g);
 if(!g.every(j=>S.props[j].owner===S.cur&&!S.props[j].mort))return false;return pr.houses===Math.min(...g.map(j=>S.props[j].houses))&&P().money>=hcost(i)}
function canSell(i,pid=S.cur){const s=SP[i],pr=S.props[i];if(s.t!=='street'||pr.owner!==pid||pr.houses===0)return false;return pr.houses===Math.max(...grp(s.g).map(j=>S.props[j].houses))}
function canMort(i,pid=S.cur){const s=SP[i],pr=S.props[i];if(pr.owner!==pid||pr.mort)return false;return s.t!=='street'||grp(s.g).every(j=>S.props[j].houses===0)}
const unmortCost=i=>Math.ceil(SP[i].price*0.55);
function canUnmort(i){const pr=S.props[i];return pr.owner===S.cur&&pr.mort&&P().money>=unmortCost(i)}
function doProp(act,i,remote,pid=S.cur){const s=SP[i],pr=S.props[i],p=S.players[pid];if(!pr||!p)return;
 const debtFix=pid!==S.cur&&p.money<0&&(act==='sell'||act==='mort');if(!debtFix&&(pid!==S.cur||busy||PR))return;
 if(act==='build'&&canBuild(i)){pay(S.cur,hcost(i),null);pr.houses++;log(`${p.name} строит ${pr.houses===5?'отель':'дом'} на «${s.name}»`)}
 if(act==='sell'&&canSell(i,pid)){pr.houses--;p.money+=hcost(i)/2;log(`${p.name} продаёт постройку на «${s.name}» (+${M(hcost(i)/2)})`)}
 if(act==='mort'&&canMort(i,pid)){pr.mort=true;p.money+=s.price/2;log(`${p.name} закладывает «${s.name}» (+${M(s.price/2)})`)}
 if(act==='unmort'&&canUnmort(i)){pay(S.cur,unmortCost(i),null);pr.mort=false;log(`${p.name} выкупает «${s.name}» (−${M(unmortCost(i))})`)}
 if(p.money>=0&&debtFix)log(`${p.name} закрыл(а) долг`);
 save();render();if(!remote)openProp(i)}
function debtOpts(pid){const o=[];Object.keys(S.props).map(Number).forEach(i=>{if(S.props[i].owner!==pid)return;if(canSell(i,pid))o.push({a:'sell',i,v:hcost(i)/2,l:`Продать ${S.props[i].houses===5?'отель':'дом'}: ${SP[i].name}`});if(canMort(i,pid))o.push({a:'mort',i,v:SP[i].price/2,l:`Заложить: ${SP[i].name}`})});return o}
function debtBox(pid){const p=S.players[pid],o=debtOpts(pid);return `<div class="debt"><b>Долг ${M(-p.money)}.</b> Найди ленокоины — выбери, что продать или заложить:</div><div class="btns">${o.map(x=>`<button class="btn ${x.a==='sell'?'ok':'sec'}" data-a="debt" data-v="${x.a}:${x.i}">${esc(x.l)} +${M(x.v)}</button>`).join('')}${o.length?'':'<p>Больше нечего продать или заложить.</p><button class="btn bad" data-a="bankrupt">Объявить банкротство</button>'}</div>`}

/* ---------- modals ---------- */

<script>

const peerId=room=>'lenapoly-'+room.toLowerCase();

function mqConnect(list){return new Promise((res,rej)=>{const tryIdx=k=>{if(k>=list.length)return rej(new Error('mq'));let done=false,c;
 try{c=mqtt.connect(BROKERS[list[k]],{clientId:'lp_'+rid(12),reconnectPeriod:2000,connectTimeout:7000,clean:true,keepalive:30})}catch(e){return tryIdx(k+1)}

function hostTransport(room,onMsg,onReady,onFail){

 make();

}
function clientTransport(room,onMsg,onStatus,useMq){
 if(QS.get('bc')){const id='c'+rid(8);const bc=new BroadcastChannel('lp-'+room);bc.onmessage=e=>{if(e.data.to===id)onMsg(e.data.m)};setTimeout(()=>onStatus('open'),50);return{send:m=>bc.postMessage({to:'host',from:id,m}),check(){}}}

  return{send:m=>{if(c&&c.connected){try{c.publish(topicH(room),JSON.stringify({from:id,m}))}catch(e){}}},check(){if(c&&!c.connected){try{c.reconnect()}catch(e){}}}}}
 onStatus('connecting');const peer=new Peer();let conn=null,timer=null;

}

 else if(m.t==='started'){CL.started=true;CL.state=null;renderClient()}
 else if(m.t==='full'){toast('Комната заполнена');}
 else if(m.t==='state'){const hadPrompt=CL.state&&CL.state.prompt&&CL.state.prompt.id;CL.state=m;CL.pid=m.you;if(!CL.local){S=m.S;busy=m.busy}renderClient(hadPrompt)}}

  const st={loading:'Загружаем игру…',broker:'Подключаемся к серверу связи…',connecting:'Соединяемся с ноутбуком…',waiting:'Ждём ответ от ноутбука…',closed:'Связь потерялась, переподключаемся…',nohost:'Ноутбук не отвечает. Проверь, что на нём открыта комната '+CL.room+' и страница не закрыта. Попробуй отсканировать QR заново.',neterr:'Нет связи с сервером. Проверь интернет на телефоне.'}[CL.status]||'';
  const lb=CL.lobby;let name='',tok=null,col=null;try{name=localStorage.getItem('lp-name')||'';tok=localStorage.getItem('lp-tok');col=localStorage.getItem('lp-col')}catch(e){}
  const meI=lb?lb.me:-1;const me=meI>=0?lb.players[meI]:null;if(me){name=me.name;tok=me.token;col=me.color}
  const pjn=$('jn'),ptk=el.querySelector('[data-t].on'),pcl=el.querySelector('[data-col].on');if(pjn&&document.activeElement===pjn||pjn&&pjn.dataset.dirty){name=pjn.value;if(ptk)tok=ptk.dataset.t;if(pcl)col=pcl.dataset.col}
  const taken=lb?lb.players.filter((p,i)=>i!==meI).map(p=>p.token):[];if(!tok||taken.includes(tok))tok=TOKENS.find(t=>!taken.includes(t));
  const takenC=lb?lb.players.filter((p,i)=>i!==meI).map(p=>p.color):[];col=firstFree(takenC,COLORS.includes(col)?col:null);
  el.innerHTML=`<div class="logo" style="font-family:Lobster;color:#e2479b;font-size:48px;text-align:center;margin:14px 0">Ленаполия</div>

  ${lb?`<div class="box"><h3>В комнате</h3>${lb.players.map(p=>`<div class="lob" style="border-left:6px solid ${p.color}"><span style="font-size:24px">${p.token}</span>${esc(p.name)}</div>`).join('')||'<p>Пока никого</p>'}<p style="font-size:14px;color:#7a3d60">${me?'Ждём, когда на ноутбуке нажмут «Начать игру».':''}</p></div>`:''}`;
  el.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{el.querySelectorAll('[data-t]').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('jn').dataset.dirty=1});
  el.querySelectorAll('[data-col]').forEach(b=>b.onclick=()=>{el.querySelectorAll('[data-col]').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('jn').dataset.dirty=1});
  $('jn').oninput=()=>{$('jn').dataset.dirty=1};if(pjn&&pjn.dataset.dirty)$('jn').dataset.dirty=1;
  $('jgo').onclick=()=>{const n=$('jn').value.trim();if(!n){toast('Напиши имя');return}const t=(el.querySelector('[data-t].on')||{}).dataset?.t||tok,c=(el.querySelector('[data-col].on')||{}).dataset?.col||col;try{localStorage.setItem('lp-name',n);localStorage.setItem('lp-tok',t);localStorage.setItem('lp-col',c)}catch(e){}csend({t:'join',key:CL.key,name:n,token:t,color:c});delete $('jn').dataset.dirty;$('jn').blur()};
  return}

  ${my&&ui?`<div class="status">${ui.status}</div><div class="btns">${bigA?ui.btn.replace(/<button class="btn" data-a="(roll|again)"[^>]*>.*?<\/button>/,''):ui.btn}</div>`:(my&&busy?'<div class="status">Ходим…</div>':'')}
  ${!my&&me.money<0&&!me.out?debtBox(pid).replace(/<button class="btn bad" data-a="bankrupt">Объявить банкротство<\/button>/,'<p>Объявить банкротство можно будет в свой ход.</p>'):''}
 </div>
 <div class="box"><h3>Моё имущество (${own.length})</h3>${own.length?own.map(i=>{const s=SP[i],pr=S.props[i];return `<div class="prow" data-c="${i}"><span class="sw" style="background:${s.g?G[s.g][0]:'#999'}"></span><span>${s.ic?s.ic+' ':''}${esc(s.name)}</span><span class="r">${pr.mort?'залог':pr.houses===5?'отель':pr.houses?'🏠×'+pr.houses:''}</span></div>`}).join(''):'<p>Пока ничего. Вставай на свободные места и покупай!</p>'}

  $('ovb').dataset.lock=1}}

else{

}

.gbox .lid .rl{position:absolute;left:43%;width:14%;top:0;bottom:0;background:linear-gradient(90deg,#ffd23f,#ffb000)}
.gbox .bow{position:absolute;left:50%;bottom:88%;width:0;height:0}
.gbox .bow i{position:absolute;width:min(14vmin,84px);height:min(9vmin,54px);border:min(2.6vmin,16px) solid #ffd23f;border-radius:50%;bottom:-6px;box-shadow:0 0 14px rgba(255,210,63,.6)}
.gbox .bow i:first-child{right:-4px;transform:rotate(-25deg)}.gbox .bow i:last-child{left:-4px;transform:rotate(25deg)}
.gbox .shine{position:absolute;inset:-30%;border-radius:50%;background:radial-gradient(circle,rgba(255,240,180,.9),rgba(255,200,80,0) 60%);opacity:0;transform:scale(.3);transition:opacity .5s,transform .8s;z-index:0}
#gift.open .gbox{animation:gshake .45s ease-in-out}
#gift.open .lid{transform:translateY(-160%) rotate(-28deg);opacity:0}
#gift.open .shine{opacity:1;transform:scale(1.3)}
#gift.open .gh{opacity:0;animation:none}
@keyframes gshake{20%{transform:rotate(-8deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(4deg)}}
</style>
<script>
(function(){
 const q=new URLSearchParams(location.search);
 if(q.has('bc')||q.has('fakemq')||q.has('nogift'))return;
 try{if(sessionStorage.getItem('lp-gift'))return}catch(e){}
 const g=document.createElement('div');g.id='gift';
 g.innerHTML='<canvas></canvas><div class="gt">Сюрприз для Лены</div><div class="gbox"><div class="shine"></div><div class="body"></div><div class="rv"></div><div class="lid"><div class="rl"></div><div class="bow"><i></i><i></i></div></div></div><div class="gh">нажми в любом месте</div>';
 document.body.appendChild(g);
 let opened=false;
 g.addEventListener('click',()=>{if(opened)return;opened=true;try{sessionStorage.setItem('lp-gift','1')}catch(e){}
  try{actx();setTimeout(()=>sfx('win'),120)}catch(e){}
  g.classList.add('open');
  const cv=g.querySelector('canvas'),cx=cv.getContext('2d'),dp=devicePixelRatio||1;let W,H;const rs=()=>{W=cv.width=innerWidth*dp;H=cv.height=innerHeight*dp};rs();
  const C=['#ff4d8d','#ffd23f','#3ddc97','#4db8ff','#b388ff','#ff8a3d','#ffffff'];let parts=[],rockets=[],t=0,run=true;
  const boom=(x,y,c)=>{const n=80+Math.random()*40;for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=(Math.random()*.8+.2)*H/150;parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,l:1,c:Math.random()<.2?'#fff':c})}};
  // центральный взрыв из коробки
  boom(W/2,H/2,'#ffd23f');boom(W/2,H/2,'#ff4d8d');
  for(let i=0;i<120;i++)parts.push({x:W/2,y:H/2,vx:(Math.random()-.5)*H/60,vy:-Math.random()*H/50,l:1.4,c:C[i%C.length],sq:1});
  const launch=()=>rockets.push({x:W*(.1+Math.random()*.8),y:H,vx:(Math.random()-.5)*2,vy:-H*(.016+Math.random()*.005),c:C[Math.floor(Math.random()*C.length)]});
  const loop=()=>{if(!run)return;t++;cx.globalCompositeOperation='destination-out';cx.fillStyle='rgba(0,0,0,.22)';cx.fillRect(0,0,W,H);cx.globalCompositeOperation='lighter';
   if(t<110&&(t%12===0||t===3))launch();
   rockets=rockets.filter(r=>{r.x+=r.vx;r.y+=r.vy;r.vy+=H/4000;cx.fillStyle=r.c;cx.beginPath();cx.arc(r.x,r.y,3*dp,0,7);cx.fill();if(r.vy>=-H/2500){boom(r.x,r.y,r.c);return false}return true});
   parts=parts.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=H/(p.sq?6000:12000);p.vx*=.985;p.vy*=.985;p.l-=.011;cx.globalAlpha=Math.max(Math.min(p.l,1),0);cx.fillStyle=p.c;
    if(p.sq)cx.fillRect(p.x,p.y,5*dp,8*dp);else{cx.beginPath();cx.arc(p.x,p.y,2.4*dp,0,7);cx.fill()}cx.globalAlpha=1;return p.l>0});
   requestAnimationFrame(loop)};loop();
  setTimeout(()=>{g.querySelector('.gbox').style.opacity='0';g.querySelector('.gbox').style.transition='opacity .6s'},900);
  setTimeout(()=>g.classList.add('gone'),2600);
  setTimeout(()=>{run=false;g.remove()},3600);
 });
})();
</script>

</body>
