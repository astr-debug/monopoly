const COLORS=['#e2479b','#2350a8','#22a052','#f39321','#8e44ad','#e03b3b','#16a5a5','#6d4c41'];
const TOKENS=['💅','🦊','🐱','☕','👑','🌸','🐻','🍕','🚗','🎧','🍓','🦄','⭐','🐸','🍩','🎀','🐶','🧛','🍎'];
const M=n=>`${n} Ł`;
const SAVE='lenapoly-v2';
let S=null,busy=false,T=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const r6=()=>1+Math.floor(Math.random()*6);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const P=()=>S.players[S.cur];
const grp=g=>SP.map((s,i)=>s.g===g?i:-1).filter(i=>i>=0);
const ownsAll=(o,g)=>grp(g).every(j=>S.props[j].owner===o);
const countType=(o,t)=>SP.filter((s,i)=>s.t===t&&S.props[i].owner===o).length;
function save(){try{localStorage.setItem(SAVE,JSON.stringify(S))}catch(e){}}
function log(m){S.log.unshift(m);S.log=S.log.slice(0,80)}
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}

function readSetup(){$('setup').querySelectorAll('[data-nm]').forEach(e=>setupData[+e.dataset.nm].name=e.value.trim()||('Игрок '+(+e.dataset.nm+1)));$('setup').querySelectorAll('[data-tk]').forEach(e=>setupData[+e.dataset.tk].token=e.value)}
function newGame(list,net){
 S={players:list.map((p,i)=>({name:p.name,token:p.token,color:COLORS[i],money:1500,pos:0,inJail:false,jailTurns:0,cards:[],shields:[],skip:0,out:false,creditor:null})),
  props:{},cur:0,phase:'roll',dbl:0,dice:[3,4],canAgain:false,pendingBuy:null,log:[],winner:null,
  decks:{chance:shuffle([...CARDS.chance.keys()]),chest:shuffle([...CARDS.chest.keys()])},extra:false};
 SP.forEach((s,i)=>{if(s.price)S.props[i]={owner:null,houses:0,mort:false}});
 if(net){S.net=true;S.room=NET.room;S.keys=list.map(l=>l.key);S.bc=NET.bc;S.broker=NET.broker}
 log(`Игра началась! Первым ходит ${S.players[0].name}.`);
 $('setup').style.display='none';$('app').style.display='flex';save();render();
}

/* ---------- money ---------- */
function pay(pi,amt,to){S.players[pi].money-=amt;if(to!=null)S.players[to].money+=amt;if(S.players[pi].money<0)S.players[pi].creditor=(to==null?null:to)}

/* ---------- movement ---------- */
async function stepMove(n){const p=P();for(let k=0;k<n;k++){p.pos=(p.pos+1)%40;if(p.pos===0){p.money+=200;log(`${p.name} проходит Старт: +200 Ł`)}render();await sleep(130)}}
async function moveTo(t){await stepMove((t-P().pos+40)%40)}
function sendToJail(pi){const p=S.players[pi];p.pos=10;p.inJail=true;p.jailTurns=0;S.canAgain=false;S.dbl=0;log(`${p.name} отправляется в Тюрьму 🔒`)}

function rentOf(i,sum,opt={}){const s=SP[i],pr=S.props[i],o=pr.owner;if(pr.mort)return 0;
 if(s.t==='street')return pr.houses>0?s.rent[pr.houses]:s.rent[0]*(ownsAll(o,s.g)?2:1);
 if(s.t==='taxi'){let r=25*Math.pow(2,countType(o,'taxi')-1);return opt.double?r*2:r}
 if(s.t==='util')return sum*(opt.ten||countType(o,'util')===2?10:4);return 0}

async function land(sum,opt={}){const p=P(),i=p.pos,s=SP[i];
 if(s.price){const pr=S.props[i];
  if(pr.owner===null){S.pendingBuy=i;log(`${p.name} на «${s.name}» — можно купить за ${M(s.price)}`)}
  else if(pr.owner!==S.cur){if(pr.mort)log(`«${s.name}» в залоге — аренды нет`);
   else{const r=rentOf(i,sum,opt);pay(S.cur,r,pr.owner);log(`${p.name} платит ${S.players[pr.owner].name} ${M(r)} за «${s.name}»`)}}
  return}
 if(s.t==='tax'){log(`${s.name}: ${M(s.amt)}`);await fine(s.amt)}
 else if(s.t==='chance'||s.t==='chest')await drawCard(s.t);
 else if(s.t==='gotojail')sendToJail(S.cur);
}
async function drawCard(kind){const id=S.decks[kind].shift(),c=CARDS[kind][id];
 render();await showCard(kind,c.x);if(c.e!=='goojf'&&c.e!=='shield')S.decks[kind].push(id);
 const p=P();log(`${kind==='chance'?'Шанс':'Сплетни'}: ${c.x}`);
 switch(c.e){
  case 'money':if(c.v>0)p.money+=c.v;else await fine(-c.v);break;
  case 'move':await moveTo(c.to);await land(S.dice[0]+S.dice[1]);break;
  case 'near':{let t=p.pos;do{t=(t+1)%40}while(SP[t].t!==c.k);await moveTo(t);
   if(c.k==='util'){const pr=S.props[t];if(pr.owner!==null&&pr.owner!==S.cur&&!pr.mort){const a=r6(),b=r6();S.dice=[a,b];log(`Бросок для аренды: ${a}+${b}`);render();await sleep(400);await land(a+b)}else await land(0)}
   else await land(0,{double:true});break}
  case 'jail':sendToJail(S.cur);break;
  case 'goojf':p.cards.push(kind);break;
  case 'shield':p.shields.push([kind,id]);log(`${p.name} получает карточку отмены штрафа`);break;
  case 'skip':p.skip=(p.skip||0)+1;log(`${p.name} пропустит следующий ход`);break;
  case 'extra':S.extra=true;log(`${p.name} получает дополнительный ход`);break;
  case 'back':p.pos=(p.pos+37)%40;render();await sleep(200);await land(S.dice[0]+S.dice[1]);break;
  case 'rep':{let h=0,o=0;Object.values(S.props).forEach(pr=>{if(pr.owner===S.cur){if(pr.houses===5)o++;else h+=pr.houses}});const v=h*c.h+o*c.o;log(`Ремонт: ${M(v)}`);if(v)await fine(v);break}
  case 'payEach':S.players.forEach((q,j)=>{if(j!==S.cur&&!q.out)pay(S.cur,c.v,j)});break;
  case 'collect':S.players.forEach((q,j)=>{if(j!==S.cur&&!q.out)pay(j,c.v,S.cur)});break;
 }
}

async function fine(v){const p=P();if(p.shields&&p.shields.length){const use=await askShield(v);if(use){const [k,id]=p.shields.pop();S.decks[k].push(id);log(`${p.name} отменяет штраф ${M(v)} карточкой 🛡️`);return}}pay(S.cur,v,null)}
function askShield(v){return ask(S.cur,'shield',{v},done=>{modal(`<div class="mh" style="background:#22a052">🛡️ Отменить штраф?</div><div class="mb"><p>${esc(P().name)}: штраф ${M(v)}. Есть карточка отмены штрафа.</p><div class="btns"><button class="btn ok" id="sy">Отменить штраф</button><button class="btn sec" id="sn">Заплатить</button></div></div>`);$('ovb').dataset.lock=1;$('sy').onclick=()=>done(true);$('sn').onclick=()=>done(false)})}
/* ---------- turn actions ---------- */
async function roll(){if(busy||PR||S.phase!=='roll'||S.pendingBuy!=null)return;const p=P();if(p.money<0){toast('Сначала погаси долг');return}
 busy=true;const a=r6(),b=r6(),d=a===b;S.dice=[a,b];render();await sleep(300);
 log(`${p.name} бросает ${a}+${b}${d?' — дубль!':''}`);
 if(p.inJail){
  if(d){p.inJail=false;p.jailTurns=0;log(`Дубль — ${p.name} выходит из тюрьмы`);S.phase='moving';await stepMove(a+b);await land(a+b)}
  else{p.jailTurns++;if(p.jailTurns>=3){pay(S.cur,50,null);p.inJail=false;p.jailTurns=0;log(`Третья попытка — ${p.name} платит 50 Ł и выходит`);S.phase='moving';await stepMove(a+b);await land(a+b)}else log(`Не дубль, ${p.name} остаётся в тюрьме`)}
  S.canAgain=false;if(S.extra){S.extra=false;if(!P().inJail)S.canAgain=true}S.phase='action';busy=false;save();render();return}
 if(d){S.dbl++;if(S.dbl===3){log('Три дубля подряд — это подозрительно!');sendToJail(S.cur);S.phase='action';busy=false;save();render();return}}
 S.canAgain=d;S.phase='moving';await stepMove(a+b);await land(a+b);
 if(S.extra){S.extra=false;S.canAgain=true}if(P().inJail)S.canAgain=false;S.phase='action';busy=false;save();render();
}
function rollAgain(){if(busy||PR)return;S.phase='roll';S.canAgain=false;roll()}
function payJail(){const p=P();if(busy||PR||S.phase!=='roll'||!p.inJail||p.money<50)return;pay(S.cur,50,null);p.inJail=false;p.jailTurns=0;log(`${p.name} платит 50 Ł и выходит из тюрьмы`);save();render()}
function useCard(){const p=P();if(busy||PR||S.phase!=='roll'||!p.inJail||!p.cards.length)return;const k=p.cards.pop();S.decks[k].push(CARDS[k].findIndex(c=>c.e==='goojf'));p.inJail=false;p.jailTurns=0;log(`${p.name} использует карточку «Выход из тюрьмы»`);save();render()}
function buy(){if(PR)return;const i=S.pendingBuy,p=P(),s=SP[i];if(i==null||p.money<s.price)return;pay(S.cur,s.price,null);S.props[i].owner=S.cur;S.pendingBuy=null;log(`${p.name} покупает «${s.name}» за ${M(s.price)}`);save();render()}
function decline(){if(PR||S.pendingBuy==null)return;const s=SP[S.pendingBuy];S.pendingBuy=null;log(`${P().name} не покупает «${s.name}»`);save();render()}
function endTurn(){if(busy||PR||S.pendingBuy!=null)return;if(P().money<0){toast('Сначала погаси долг');return}
 S.dbl=0;S.canAgain=false;nextPlayer();save();render()}
function nextPlayer(){let n=S.cur;for(;;){n=(n+1)%S.players.length;const q=S.players[n];if(q.out)continue;if(q.skip>0){q.skip--;log(`${q.name} пропускает ход`);continue}break}S.cur=n;S.phase='roll';S.dbl=0;S.canAgain=false;S.pendingBuy=null;

 let inner,style=`grid-row:${r};grid-column:${c};`,cls='cell '+side;
 if(i===10)inner=`<div class="jail"><div class="bars"></div><div class="cin"><div class="ic">${s.ic}</div><div class="nm2">${s.name}</div></div></div><div class="vis lft"><span>просто</span></div><div class="vis bot">в гостях</div>`;
 else if(side==='corner'){const rot={0:-45,20:135,30:-135}[i];inner=`<div class="cin" style="transform:rotate(${rot}deg)">${i===0?'<div class="sb">'+s.sub+'</div>':''}<div class="nm2" style="font-size:calc(var(--u)/${i===0?3.6:4.4})">${s.name}</div><div class="ic">${s.ic}</div>${i!==0&&s.sub?`<div class="sb">${s.sub}</div>`:''}</div>`}
 else{let body;
  if(s.t==='street'){const h=pr.houses;body=`<div class="bar" style="background:${G[s.g][0]}">${h===5?'<i class="ht"></i>':'<i class="hs"></i>'.repeat(h)}</div><div class="nm" ${fit(s.name)}>${s.name}</div><div class="pr">${M(s.price)}</div>`}
  else if(s.t==='chance')body=`<div class="nm" ${fit(s.name)}>${s.name}</div><div class="q">?</div>`;
  else if(s.t==='tax')body=`<div class="nm" ${fit(s.name)}>${s.name}</div><div class="ic2">${s.ic}</div><div class="pr">заплати ${M(s.amt)}</div>`;
  else body=`<div class="nm" ${fit(s.name)}>${s.name}</div><div class="ic2">${s.ic}</div><div class="pr">${s.price?M(s.price):''}</div>`;
  inner=`<div class="in">${body}</div>`}
 if(pr&&pr.owner!=null){style+=`box-shadow:inset 0 0 0 3px ${S.players[pr.owner].color};`;if(pr.mort)cls+=' mort'}
 const tk=S.players.filter(p=>!p.out&&p.pos===i).map(tokHTML).join('');
 return `<div class="${cls}" style="${style}" data-c="${i}">${inner}${tk?`<div class="toks">${tk}</div>`:''}</div>`}
function boardHTML(){const p=P();let h=SP.map((_,i)=>cellHTML(i)).join('');
 h+=`<div class="center"><div class="slot cs"><b>💬</b>Сплетни</div><div class="slot ch"><b>?</b>Шанс</div><div class="banner">ЛЕНАПОЛИЯ</div><div class="cdice">${dieHTML(S.dice[0])}${dieHTML(S.dice[1])}</div><div class="cturn">${S.winner!=null?'🏆<br>'+esc(S.players[S.winner].name):tokHTML(p)+'ходит<br>'+esc(p.name)}</div></div>`;
 return h}
function render(){if(!S)return;const p=P();const h=boardHTML();
 $('board').innerHTML=h;autofit();$('board').querySelectorAll('[data-c]').forEach(e=>e.onclick=()=>openProp(+e.dataset.c));
 const {status,btn}=turnUI();
 let pl=S.players.map((q,j)=>{const own=Object.keys(S.props).filter(k=>S.props[k].owner===j);
  return `<div class="pl ${j===S.cur&&S.winner==null?'on':''} ${q.out?'out':''}" style="border-color:${q.color}"><span style="font-size:20px">${q.token}</span><span>${S.net?(netOnline(j)?'🟢 ':'⚪ '):''}${esc(q.name)}${q.inJail?' 🔒':''}${q.cards.length?' 🎫':''}${q.shields&&q.shields.length?' 🛡️':''}${q.skip?' ⏸️':''}</span><span class="m" style="${q.money<0?'color:#c62828':''}">${S.net?'':M(q.money)}</span></div>${own.length?`<div class="chips">${own.map(k=>`<button class="chip" data-c="${k}" style="background:${SP[k].g?G[SP[k].g][0]:'#777'};${S.props[k].mort?'opacity:.45;':''}${SP[k].g==='yellow'||SP[k].g==='lb'?'color:#2a2230':''}">${esc(SP[k].name)}${S.props[k].houses?' '+(S.props[k].houses===5?'🏨':'🏠'+S.props[k].houses):''}</button>`).join('')}</div>`:''}`}).join('');
 $('panel').innerHTML=`<div class="box"><div class="cur"><span class="big">${p.token}</span><span class="nmb">${esc(p.name)}</span><span class="money">${S.net?'':M(p.money)}</span></div><div class="status">${status}</div><div class="btns">${btn}</div></div>
 <div class="box"><h3>Игроки</h3>${pl}<div class="btns"><button class="btn sec" data-a="trade">🤝 Обмен</button><button class="btn sec" data-a="rules">Правила</button><button class="btn sec" data-a="new">Новая игра</button>${S.net?'<button class="btn sec" data-a="qr">📱 QR для входа</button>':''}</div></div>
 <div class="box"><h3>Что происходит</h3><div class="log">${S.log.map(m=>`<div>${esc(m)}</div>`).join('')}</div></div>`;
 $('panel').querySelectorAll('[data-c]').forEach(e=>e.onclick=()=>openProp(+e.dataset.c));
 const A={roll,again:rollAgain,end:endTurn,buy,decline,payjail:payJail,card:useCard,bankrupt:()=>modal(`<div class="mh" style="background:#c62828">Банкротство?</div><div class="mb"><p>${esc(p.name)} выбывает из игры.</p><div class="btns"><button class="btn bad" id="bk">Да</button><button class="btn sec" onclick="closeM()">Отмена</button></div></div>`)||($('bk').onclick=()=>{closeM();bankrupt()}),trade:openTrade,rules:openRules,new:askNew,qr:showJoinQR,debt:e=>{const [a,i]=e.dataset.v.split(':');doProp(a,+i,true)}};
 $('panel').querySelectorAll('[data-a]').forEach(e=>e.onclick=()=>A[e.dataset.a]&&A[e.dataset.a](e));
 pushState();
 if(S.winner!=null)celebrate(S.players[S.winner],true);else WIN_SHOWN=null;
}

/* ---------- start ---------- */
try{document.fonts.ready.then(()=>{if(S)render()})}catch(e){}
let rzT;addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(S)render()},150)});
</script>
<script>
/* ================= NETWORK (laptop = host, phones = clients) ================= */
const QS=new URLSearchParams(location.search);
const NET={mode:null,room:null,tx:null,who:{},cids:new Set(),lobby:[],bc:false,broker:null,seen:{},phoneHost:false};
const CL={room:null,key:null,tx:null,state:null,lobby:null,pid:-1,status:'connecting',started:false};
const PEER_URLS=['https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js','https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js','https://unpkg.com/peerjs@1.5.3/dist/peerjs.min.js'];
const MQTT_URLS=['https://cdn.jsdelivr.net/npm/mqtt@5/dist/mqtt.min.js','https://unpkg.com/mqtt@5/dist/mqtt.min.js'];
const BROKERS=['wss://broker.hivemq.com:8884/mqtt','wss://broker.emqx.io:8084/mqtt'];
const topicH=r=>'lenapoly/v1/'+r+'/h',topicC=(r,id)=>'lenapoly/v1/'+r+'/c/'+id;
const QR_URLS=['https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js','https://unpkg.com/qrcode-generator@1.4.4/qrcode.js'];
function loadScript(urls){return new Promise((res,rej)=>{let i=0;const next=()=>{if(i>=urls.length)return rej(new Error('load'));const el=document.createElement('script');el.src=urls[i++];el.onload=()=>res();el.onerror=()=>{el.remove();next()};document.head.appendChild(el)};next()})}
const rid=n=>{const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let r='';for(let i=0;i<n;i++)r+=A[Math.floor(Math.random()*A.length)];return r};
const peerId=room=>'lenapoly-'+room.toLowerCase();
const joinURL=()=>location.origin+location.pathname+'?join='+NET.room+(NET.broker!=null?'&b='+NET.broker:'')+(NET.bc?'&bc=1':'')+(QS.get('fakemq')?'&fakemq=1':'');
const netOnline=pid=>Object.entries(NET.who).some(([c,p])=>p===pid&&(c==='local'||Date.now()-(NET.seen[c]||0)<25000));
const NETFAIL='Не получилось подключиться к сервису связи. Режим с телефонов работает, когда игра открыта по ссылке на GitHub Pages (astr-debug.github.io/monopoly), а не внутри Claude.';

/* ---- transports ---- */
function mqConnect(list){return new Promise((res,rej)=>{const tryIdx=k=>{if(k>=list.length)return rej(new Error('mq'));let done=false,c;
 try{c=mqtt.connect(BROKERS[list[k]],{clientId:'lp_'+rid(12),reconnectPeriod:2000,connectTimeout:7000,clean:true,keepalive:30})}catch(e){return tryIdx(k+1)}
 const t=setTimeout(()=>{if(!done){done=true;try{c.end(true)}catch(e){}tryIdx(k+1)}},8000);
 c.on('connect',()=>{if(!done){done=true;clearTimeout(t);res({client:c,idx:list[k]})}})};tryIdx(0)})}
async function loadNetLibs(){const r={mq:false,peer:false};
 if(QS.get('fakemq'))r.mq=!!window.mqtt;
 await Promise.all([loadScript(MQTT_URLS).then(()=>r.mq=true).catch(()=>{}),loadScript(PEER_URLS).then(()=>r.peer=true).catch(()=>{})]);return r}
function hostTransport(room,onMsg,onReady,onFail){
 if(NET.bc){const bc=new BroadcastChannel('lp-'+room);bc.onmessage=e=>{const d=e.data;if(d.to==='host')onMsg(d.from,d.m)};setTimeout(onReady,0);return{send:(id,m)=>bc.postMessage({to:id,m})}}
 const conns={};let tries=0,peer,mq=null,mqSettled=false,peerOpen=false,peerDead=!window.Peer;
 const maybeReady=()=>{if(mqSettled&&(mq||peerOpen))onReady();else if(mqSettled&&peerDead)onFail&&onFail()};
 if(window.mqtt){const pref=NET.broker!=null?[NET.broker,...BROKERS.map((_,i)=>i).filter(i=>i!==NET.broker)]:BROKERS.map((_,i)=>i);
  mqConnect(pref).then(({client,idx})=>{mq=client;NET.broker=idx;
   const sub=()=>client.subscribe(topicH(room),{qos:0});sub();client.on('connect',sub);
   client.on('message',(t,buf)=>{let d;try{d=JSON.parse(buf.toString())}catch(e){return}if(d&&d.from)onMsg('m:'+String(d.from).slice(0,20),d.m)});
   mqSettled=true;maybeReady()}).catch(()=>{mqSettled=true;maybeReady()})}
 else mqSettled=true;
 const make=()=>{if(!window.Peer)return;peer=new Peer(peerId(room));
  peer.on('open',()=>{tries=0;peerOpen=true;maybeReady()});
  peer.on('connection',c=>{c.on('open',()=>{conns[c.peer]=c});c.on('data',d=>onMsg(c.peer,d));c.on('close',()=>{delete conns[c.peer];delete NET.who[c.peer];if(S)render()})});
  peer.on('disconnected',()=>{try{peer.reconnect()}catch(e){}});
  peer.on('error',e=>{if(e.type==='unavailable-id'&&tries<15){tries++;try{peer.destroy()}catch(x){}setTimeout(make,3000)}else if(['network','server-error','socket-error','browser-incompatible','ssl-unavailable'].includes(e.type)){peerDead=true;maybeReady()}})};
 make();
 return{send:(id,m)=>{if(id.startsWith('m:')){if(mq){try{mq.publish(topicC(room,id.slice(2)),JSON.stringify(m))}catch(e){}}return}const c=conns[id];if(c&&c.open){try{c.send(m)}catch(e){}}}};
}
function clientTransport(room,onMsg,onStatus,useMq){
 if(QS.get('bc')){const id='c'+rid(8);const bc=new BroadcastChannel('lp-'+room);bc.onmessage=e=>{if(e.data.to===id)onMsg(e.data.m)};setTimeout(()=>onStatus('open'),50);return{send:m=>bc.postMessage({to:'host',from:id,m}),check(){}}}
 if(useMq!=null){const id=rid(12);let c=null;onStatus('broker');
  mqConnect([useMq]).then(({client})=>{c=client;const sub=()=>client.subscribe(topicC(room,id),{qos:0},()=>onStatus('open'));sub();
   client.on('connect',sub);client.on('offline',()=>onStatus('closed'));
   client.on('message',(t,buf)=>{let d;try{d=JSON.parse(buf.toString())}catch(e){return}onMsg(d)})}).catch(()=>onStatus('neterr'));
  return{send:m=>{if(c&&c.connected){try{c.publish(topicH(room),JSON.stringify({from:id,m}))}catch(e){}}},check(){if(c&&!c.connected){try{c.reconnect()}catch(e){}}}}}
 onStatus('connecting');const peer=new Peer();let conn=null,timer=null;
 const connect=()=>{clearTimeout(timer);if(conn&&conn.open)return;try{conn&&conn.close()}catch(e){}
  conn=peer.connect(peerId(room),{reliable:true});
  conn.on('open',()=>onStatus('open'));conn.on('data',onMsg);
  conn.on('close',()=>{onStatus('closed');timer=setTimeout(connect,2000)});conn.on('error',()=>{})};
 peer.on('open',connect);
 peer.on('disconnected',()=>{try{peer.reconnect()}catch(e){}});
 peer.on('error',e=>{if(e.type==='peer-unavailable'){onStatus('nohost');timer=setTimeout(connect,3000)}else if(['network','server-error','socket-error'].includes(e.type)){onStatus('neterr')}});
 return{send:m=>{if(conn&&conn.open){try{conn.send(m)}catch(e){}}},check(){if(peer.disconnected){try{peer.reconnect()}catch(e){}}if(!conn||!conn.open)connect()}};
}
/* ---- host ---- */
function wrapLocal(tx){const send=tx.send;tx.send=(id,m)=>{if(id==='local'){setTimeout(()=>onClientMsg(m),0);return}send(id,m)};return tx}
function setupLocalClient(key){NET.phoneHost=true;CL.local=true;CL.key=key;CL.room=NET.room;CL.status='open';CL.tx={send:m=>setTimeout(()=>onHostMsg('local',m),0),check(){}};
 const wl=()=>{try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}};wl();
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)wl()})}
function showLocalClient(){$('setup').style.display='none';$('app').style.display='none';$('client').style.display='block'}
async function hostStart(me){NET.bc=!!QS.get('bc');NET.room=rid(5);NET.lobby=[];NET.who={};NET.mode='host';
 if(me){const key='local-'+rid(10);NET.lobby.push({key,name:me.name,token:me.token,cid:'local'});NET.cids.add('local');setupLocalClient(key)}
 $('setup').innerHTML=`<div class="logo">Ленаполия</div><div class="box"><p>Создаём комнату…</p></div>`;
 if(!NET.bc){const r=await loadNetLibs();if(!r.mq&&!r.peer){$('setup').innerHTML+=`<div class="netwarn">${NETFAIL}</div>`;return}}
 NET.tx=wrapLocal(hostTransport(NET.room,onHostMsg,renderLobby,()=>{$('setup').insertAdjacentHTML('beforeend',`<div class="netwarn">${NETFAIL}</div>`)}));
 loadScript(QR_URLS).then(()=>{if(!S)renderLobby()}).catch(()=>{});
}
async function hostResume(){NET.mode='host';NET.room=S.room;NET.bc=!!S.bc;
 if(!NET.bc){const r=await loadNetLibs();if(!r.mq&&!r.peer){toast('Нет связи с сервисом для телефонов');return}}
 NET.broker=S.broker!=null?S.broker:null;if(S.phoneHost){const key=S.keys[S.localPid];setupLocalClient(key);NET.who.local=S.localPid;showLocalClient()}
 NET.tx=wrapLocal(hostTransport(NET.room,onHostMsg,()=>{S.broker=NET.broker;save();render()},()=>toast('Нет связи с сервисом для телефонов')));
 loadScript(QR_URLS).catch(()=>{});
}
function qrSVG(url){try{const q=qrcode(0,'M');q.addData(url);q.make();return q.createSvgTag({cellSize:6,margin:2,scalable:true})}catch(e){return ''}}
function renderLobby(){if(S)return;const url=joinURL();
 $('setup').innerHTML=`<div class="logo">Ленаполия</div>
 <div class="box"><h3>Отсканируйте QR или откройте ссылку на телефоне</h3><div class="qrbox">${qrSVG(url)||'<p>QR загружается…</p>'}</div><div class="link">${esc(url)}</div><p style="font-size:14px;color:#7a3d60">Код комнаты: <b style="font-size:20px">${NET.room}</b></p></div>
 <div class="box"><h3>Игроки (${NET.lobby.length}/8)</h3>${NET.lobby.map((l,i)=>`<div class="lob"><span style="font-size:26px">${l.token}</span><span>${esc(l.name)}</span>${l.cid&&NET.cids.has(l.cid)||l.cid==='local'?'':' <small>(нет связи)</small>'}${l.cid==='local'?' <small>(этот телефон)</small>':`<button class="x" data-kick="${i}" title="Убрать">✕</button>`}</div>`).join('')||'<p>Пока никого. Ждём телефоны…</p>'}
 <div class="btns"><button class="btn" id="startnet" ${NET.lobby.length<2?'disabled':''}>Начать игру</button><button class="btn sec" id="cancelnet">Отмена</button></div></div>`;
 $('startnet').onclick=()=>{if(NET.lobby.length<2)return;const L=NET.lobby;newGame(L.map(l=>({name:l.name,token:l.token,key:l.key})),true);NET.who={};L.forEach((l,i)=>{if(l.cid)NET.who[l.cid]=i});if(NET.phoneHost){S.phoneHost=true;S.localPid=L.findIndex(l=>l.cid==='local');save();showLocalClient()}render()};
 $('cancelnet').onclick=()=>location.reload();
 $('setup').querySelectorAll('[data-kick]').forEach(b=>b.onclick=()=>{NET.lobby.splice(+b.dataset.kick,1);renderLobby();sendLobby()});
}
function sendLobby(){const pl=NET.lobby.map(x=>({name:x.name,token:x.token}));NET.cids.forEach(cid=>{const me=NET.lobby.findIndex(l=>l.cid===cid);NET.tx.send(cid,{t:'lobby',players:pl,me})})}
function onHostMsg(cid,m){if(!m||typeof m!=='object')return;NET.cids.add(cid);const wasOff=!NET.seen[cid]||Date.now()-NET.seen[cid]>25000;NET.seen[cid]=Date.now();
 if(m.t==='ping'){if(wasOff&&S)render();return}
 if(m.t==='hello'||m.t==='join'){
  if(S&&S.net){const pid=S.keys.indexOf(m.key);if(pid>=0){for(const k in NET.who)if(NET.who[k]===pid)delete NET.who[k];NET.who[cid]=pid;render()}else NET.tx.send(cid,{t:'started'});return}
  if(S)return;
  let l=NET.lobby.find(x=>x.key===m.key);
  if(m.t==='join'){if(!l){if(NET.lobby.length>=8){NET.tx.send(cid,{t:'full'});return}l={key:String(m.key).slice(0,40)};NET.lobby.push(l)}
   l.name=String(m.name||'').trim().slice(0,14)||'Игрок';l.token=TOKENS.includes(m.token)?m.token:TOKENS[0]}
  if(l)l.cid=cid;renderLobby();sendLobby();return}
 const pid=NET.who[cid];if(pid==null||!S||S.winner!=null&&m.t!=='answer')return;
 if(m.t==='act'){if(pid!==S.cur)return;const F={roll,again:rollAgain,end:endTurn,buy,decline,payjail:payJail,card:useCard,bankrupt}[m.a];F&&F()}
 else if(m.t==='prop'){if(['build','sell','mort','unmort'].includes(m.a))doProp(m.a,+m.i,true,pid)}
 else if(m.t==='answer')answer(pid,m.id,m.v);
 else if(m.t==='trade'){if(pid===S.cur)proposeTrade(pid,+m.to,m.g,m.tt,m.gm,m.tm)}
}
let pushT=null,pushLast=0;
function pushState(){if(NET.mode!=='host'||!NET.tx||!S||!S.net)return;const now=Date.now();if(now-pushLast<150){if(!pushT)pushT=setTimeout(()=>{pushT=null;pushState()},160-(now-pushLast));return}pushLast=now;
 const snap=JSON.parse(JSON.stringify(S));delete snap.keys;snap.log=snap.log.slice(0,15);
 for(const cid in NET.who){const pid=NET.who[cid];const mine=JSON.parse(JSON.stringify(snap));mine.players.forEach((q,j)=>{if(j!==pid){q.money=null;q.creditor=null}});NET.tx.send(cid,{t:'state',S:mine,you:pid,busy,prompt:PR&&PR.pid===pid?{id:PR.id,kind:PR.kind,data:PR.data}:null,ui:pid===S.cur&&!PR?turnUI():null})}}
function showJoinQR(){const url=joinURL();modal(`<div class="mh" style="background:#e2479b">📱 Вход с телефона</div><div class="mb"><div class="qrbox">${qrSVG(url)}</div><div class="link">${esc(url)}</div><p style="font-size:14px">Если телефон отключился, просто откройте ссылку снова — игрок вернётся в игру.</p><div class="btns"><button class="btn sec" onclick="closeM()">Закрыть</button></div></div>`)}

/* ---- поле на телефоне ---- */
function openBoardView(){if($('bov'))return;const d=document.createElement('div');d.id='bov';d.className='bov';d.innerHTML='<div class="board" id="pboard"></div><div class="btns" style="width:min(100vw - 16px,760px)"><button class="btn sec" id="bovx">Закрыть поле</button></div>';document.body.appendChild(d);$('bovx').onclick=()=>d.remove();drawBoardView()}
function drawBoardView(){const b=$('pboard');if(!b||!S)return;b.innerHTML=boardHTML();autofit(b);b.querySelectorAll('[data-c]').forEach(e=>e.onclick=()=>openProp(+e.dataset.c,(a,i)=>{csend({t:'prop',a,i});closeM()}))}
/* ---- phone ---- */
async function clientStart(room){CL.room=room;$('setup').style.display='none';$('app').style.display='none';$('client').style.display='block';
 const ks=(QS.get('bc')||QS.get('fakemq'))?sessionStorage:localStorage;try{CL.key=ks.getItem('lp-key-'+room)||rid(16);ks.setItem('lp-key-'+room,CL.key)}catch(e){CL.key=CL.key||rid(16)}
 CL.status='loading';renderClient();
 const b=QS.get('b');let useMq=null;
 if(!QS.get('bc')){const r=await loadNetLibs();if(b!=null&&r.mq)useMq=+b;else if(!r.peer){CL.status='neterr';renderClient();return}}
 const go=mq=>{CL.tx=clientTransport(room,onClientMsg,st=>{if(CL.lobby||CL.state||CL.started){if(st==='open')CL.tx.send({t:'hello',key:CL.key});CL.status=st;if(st!=='open'||!CL.shown)renderClient();return}
   if(st==='neterr'&&mq!=null&&window.Peer){go(null);return}
   if(st==='open')CL.tx.send({t:'hello',key:CL.key});
   CL.status=st==='open'?'waiting':st;renderClient()},mq)};
 go(useMq);
 let n=0;setInterval(()=>{if(!CL.tx)return;if(!CL.lobby&&!CL.state&&!CL.started){CL.tx.send({t:'hello',key:CL.key});n++;if(n===5&&CL.status==='waiting'){CL.status='nohost';renderClient()}}else CL.tx.send({t:'ping'})},3000);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden&&CL.tx){CL.tx.check();CL.tx.send({t:'hello',key:CL.key})}});
}
function onClientMsg(m){if(!m)return;
 if(m.t==='lobby'){CL.lobby=m;CL.state=null;CL.status='open';renderClient()}
 else if(m.t==='started'){CL.started=true;CL.state=null;renderClient()}
 else if(m.t==='full'){toast('Комната заполнена');}
 else if(m.t==='state'){const hadPrompt=CL.state&&CL.state.prompt&&CL.state.prompt.id;CL.state=m;CL.pid=m.you;if(!CL.local){S=m.S;busy=m.busy}renderClient(hadPrompt)}}
const csend=m=>CL.tx&&CL.tx.send(m);
function renderClient(hadPrompt){const el=$('client');
 if(!CL.state){
  if(CL.started){el.innerHTML=`<div class="logo" style="font-family:Lobster;color:#e2479b;font-size:48px;text-align:center;margin:20px 0">Ленаполия</div><div class="box"><p>Игра уже началась без этого телефона. Если ты игрок — открой ссылку с того же телефона, с которого входил(а).</p></div>`;return}
  const st={loading:'Загружаем игру…',broker:'Подключаемся к серверу связи…',connecting:'Соединяемся с ноутбуком…',waiting:'Ждём ответ от ноутбука…',closed:'Связь потерялась, переподключаемся…',nohost:'Ноутбук не отвечает. Проверь, что на нём открыта комната '+CL.room+' и страница не закрыта. Попробуй отсканировать QR заново.',neterr:'Нет связи с сервером. Проверь интернет на телефоне.'}[CL.status]||'';
  const lb=CL.lobby;let name='',tok=null;try{name=localStorage.getItem('lp-name')||'';tok=localStorage.getItem('lp-tok')}catch(e){}
  const meI=lb?lb.me:-1;const me=meI>=0?lb.players[meI]:null;if(me){name=me.name;tok=me.token}
  const pjn=$('jn'),ptk=el.querySelector('[data-t].on');if(pjn&&document.activeElement===pjn||pjn&&pjn.dataset.dirty){name=pjn.value;if(ptk)tok=ptk.dataset.t}
  const taken=lb?lb.players.filter((p,i)=>i!==meI).map(p=>p.token):[];if(!tok||taken.includes(tok))tok=TOKENS.find(t=>!taken.includes(t));
  el.innerHTML=`<div class="logo" style="font-family:Lobster;color:#e2479b;font-size:48px;text-align:center;margin:14px 0">Ленаполия</div>
  ${st?`<div class="netwarn">${esc(st)}</div>`:''}
  <div class="box"><h3>${me?'Ты в игре! Можно поменять имя или фишку':'Как тебя зовут?'}</h3><div class="row"><input id="jn" maxlength="14" value="${esc(name)}" placeholder="Имя"></div>
  <h3>Фишка</h3><div class="tokpick">${TOKENS.map(t=>`<button data-t="${t}" class="${t===tok?'on':''}" ${taken.includes(t)?'disabled':''}>${t}</button>`).join('')}</div>
  <div class="btns"><button class="btn" id="jgo" ${!CL.lobby?'disabled':''}>${me?'Сохранить':'Я в игре!'}</button></div></div>
  ${lb?`<div class="box"><h3>В комнате</h3>${lb.players.map(p=>`<div class="lob"><span style="font-size:24px">${p.token}</span>${esc(p.name)}</div>`).join('')||'<p>Пока никого</p>'}<p style="font-size:14px;color:#7a3d60">${me?'Ждём, когда на ноутбуке нажмут «Начать игру».':''}</p></div>`:''}`;
  el.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{el.querySelectorAll('[data-t]').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('jn').dataset.dirty=1});
  $('jn').oninput=()=>{$('jn').dataset.dirty=1};if(pjn&&pjn.dataset.dirty)$('jn').dataset.dirty=1;
  $('jgo').onclick=()=>{const n=$('jn').value.trim();if(!n){toast('Напиши имя');return}const t=(el.querySelector('[data-t].on')||{}).dataset?.t||tok;try{localStorage.setItem('lp-name',n);localStorage.setItem('lp-tok',t)}catch(e){}csend({t:'join',key:CL.key,name:n,token:t});delete $('jn').dataset.dirty;$('jn').blur()};
  return}
 const m=CL.state,pid=CL.pid,me=S.players[pid],cur=S.players[S.cur],my=pid===S.cur&&S.winner==null;
 const own=Object.keys(S.props).map(Number).filter(i=>S.props[i].owner===pid);
 let turn;if(S.winner!=null)turn=`🏆 Победа: ${esc(S.players[S.winner].name)}!`;else if(my)turn='Твой ход!';else turn=`Ходит ${esc(cur.token+' '+cur.name)}`;
 const ui=m.ui;
 el.innerHTML=`<div class="board cboard" id="cbv"></div><div class="box" style="margin-top:8px"><div class="me"><span class="big">${me.token}</span><span class="nmb">${esc(me.name)}${me.out?' (банкрот)':''}</span><span class="money" style="${me.money<0?'color:#c62828':''}">${M(me.money)}</span></div>
  <div style="font-size:14px;color:#7a3d60;margin-top:4px">📍 ${esc(SP[me.pos].name)}${me.inJail?' — в тюрьме 🔒':''}${me.cards.length?' · 🎫 выход из тюрьмы':''}${me.shields&&me.shields.length?' · 🛡️ отмена штрафа':''}${me.skip?' · ⏸️ пропуск хода':''}</div>
  <div class="turnbar ${my?'my':''}">${turn}</div><div class="mydice">${dieHTML(S.dice[0])}${dieHTML(S.dice[1])}</div>
  ${my&&ui?`<div class="status">${ui.status}</div><div class="btns">${ui.btn}</div>`:(my&&busy?'<div class="status">Ходим…</div>':'')}
  ${!my&&me.money<0&&!me.out?debtBox(pid).replace(/<button class="btn bad" data-a="bankrupt">Объявить банкротство<\/button>/,'<p>Объявить банкротство можно будет в свой ход.</p>'):''}
 </div>
 <div class="box"><h3>Моё имущество (${own.length})</h3>${own.length?own.map(i=>{const s=SP[i],pr=S.props[i];return `<div class="prow" data-c="${i}"><span class="sw" style="background:${s.g?G[s.g][0]:'#999'}"></span><span>${s.ic?s.ic+' ':''}${esc(s.name)}</span><span class="r">${pr.mort?'залог':pr.houses===5?'отель':pr.houses?'🏠×'+pr.houses:''}</span></div>`}).join(''):'<p>Пока ничего. Вставай на свободные места и покупай!</p>'}
  ${my&&!busy?'<div class="btns"><button class="btn sec" id="ctrade">🤝 Обмен</button></div>':''}</div>
 <div class="box"><h3>Игроки</h3>${S.players.map((q,j)=>`<div class="pl ${j===S.cur?'on':''} ${q.out?'out':''}" style="border-color:${q.color}"><span style="font-size:20px">${q.token}</span><span>${esc(q.name)}${j===pid?' (ты)':''}</span><span class="m">${j===pid?M(q.money):''}</span></div>`).join('')}</div>
 <div class="box"><h3>Что происходит</h3><div class="log">${S.log.slice(0,8).map(x=>`<div>${esc(x)}</div>`).join('')}</div><div class="btns">${CL.local?'<button class="btn sec" id="cinv">📱 Пригласить</button>':''}<button class="btn sec" id="crules">Правила</button></div></div>`;
 el.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const a=b.dataset.a;
  if(a==='bankrupt'){modal(`<div class="mh" style="background:#c62828">Банкротство?</div><div class="mb"><p>Ты выбываешь из игры.</p><div class="btns"><button class="btn bad" id="bk">Да</button><button class="btn sec" onclick="closeM()">Отмена</button></div></div>`);$('bk').onclick=()=>{closeM();csend({t:'act',a})};return}
  if(a==='new')return;if(a==='debt'){const [x,i]=b.dataset.v.split(':');csend({t:'prop',a:x,i:+i});return}csend({t:'act',a})});
 el.querySelectorAll('[data-c]').forEach(r=>r.onclick=()=>openProp(+r.dataset.c,(a,i)=>{csend({t:'prop',a,i});closeM()}));
 if($('ctrade'))$('ctrade').onclick=()=>{T={to:null};window.SUBMIT_TRADE=(from,to,g,t,gm,tm)=>csend({t:'trade',to,g,tt:t,gm,tm});drawTrade()};
 $('crules').onclick=openRules;{const bv=$('cbv');bv.innerHTML=boardHTML();autofit(bv);bv.querySelectorAll('[data-c]').forEach(e=>e.onclick=()=>openProp(+e.dataset.c,(a,i)=>{csend({t:'prop',a,i});closeM()}))}if($('cinv'))$('cinv').onclick=showJoinQR;
 if(CL.local&&!CL.warned){CL.warned=1;toast('Этот телефон ведёт игру — не закрывай вкладку и не блокируй экран надолго')}
 const pr=m.prompt;
 if(pr){if(!hadPrompt||hadPrompt!==pr.id){
  if(pr.kind==='card'){const d=pr.data;modal(`<div class="mh" style="background:${d.kind==='chance'?'#f39321':'#e2479b'}">${d.kind==='chance'?'❓ Шанс':'💬 Сплетни'}</div><div class="mb"><div class="card-t">${esc(d.text)}</div><div class="btns"><button class="btn" id="pa">Ок</button></div></div>`);$('pa').onclick=()=>{closeM();csend({t:'answer',id:pr.id,v:true})}}
  else if(pr.kind==='shield'){modal(`<div class="mh" style="background:#22a052">🛡️ Отменить штраф?</div><div class="mb"><p>Штраф ${M(pr.data.v)}. У тебя есть карточка отмены штрафа.</p><div class="btns"><button class="btn ok" id="pa">Отменить штраф</button><button class="btn sec" id="pb">Заплатить</button></div></div>`);$('pa').onclick=()=>{closeM();csend({t:'answer',id:pr.id,v:true})};$('pb').onclick=()=>{closeM();csend({t:'answer',id:pr.id,v:false})}}
  else if(pr.kind==='trade'){const d=pr.data,f=S.players[d.from];modal(`<div class="mh" style="background:#8e44ad">🤝 Обмен от ${esc(f.name)}</div><div class="mb"><p><b>${esc(f.name)}</b> отдаёт: ${esc(d.give)}</p><p><b>Ты</b> отдаёшь: ${esc(d.get)}</p><div class="btns"><button class="btn ok" id="pa">Принять</button><button class="btn bad" id="pb">Отказаться</button></div></div>`);$('pa').onclick=()=>{closeM();csend({t:'answer',id:pr.id,v:true})};$('pb').onclick=()=>{closeM();csend({t:'answer',id:pr.id,v:false})}}
  $('ovb').dataset.lock=1}}
 else if(hadPrompt&&$('ovb')&&$('ovb').dataset.lock)closeM();
 if(S.winner!=null)celebrate(S.players[S.winner],false);
}
/* ---- start ---- */
if(QS.get('join')){clientStart(QS.get('join').toUpperCase())}
else{
try{const raw=localStorage.getItem(SAVE);if(raw){S=JSON.parse(raw);if(S.phase==='moving')S.phase='action'}}catch(e){S=null}
if(S&&S.players){if(!S.phoneHost)$('app').style.display='flex';render();if(S.net)hostResume()}else{S=null;renderSetup()}
}

</script>
</body>
</html>
